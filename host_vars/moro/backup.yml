---
# Контракты бэкапов moro (роль backup; раннер уже выкатан руками 14.10 —
# роль при первом прогоне приведёт plist/контракты к этому же виду).
# pg1c-data не тарится (живой PG) — его базам нужен pg_dump-контракт
# со стороны v8dock (зона v8dock-сессии), catch-all тут только страховка.
backup_contracts:
  docker-volumes:
    role: docker-volumes
    dest: docker-volumes
    items:
      - name: all-volumes
        kind: docker-volumes
        skip: "gomod|gocache|playwright|dev-cache|pg1c-data$"
        retention: 7
      - name: manifest
        kind: docker-manifest
        retention: 7
  # pg-дампы: свой ship обязателен — ship первого контракта уходит ДО того,
  # как pg1c надампит файлы (прецедент 08.11: pg-дампы неделю не доезжали)
  pg1c:
    role: pg1c
    ship_to: "root@micro:/mnt/torrent/disk2/docker-backups/moro"
    items:
      - name: all-bases
        kind: pg
        container: pg1c
        db: all
        retention: 7
  semaphore:
    role: semaphore
    items:
      - name: semaphore-data
        kind: bind
        path: /Users/m/code/_local/semaphore/data
        retention: 7
