---
# Playbook to run certbot tasks for SSL certificates
- name: Run certbot for SSL certificate management
  hosts: vpnserver_role:subnginx3xui_role:untilwall_role:semaphore_role:lampa_role:trackertop_role:vdl_role
  vars:
    ansible_roles_path: "{{ playbook_dir }}/../roles"
  pre_tasks:
    # Include vars only for roles that use SSL certificates
    - name: Include certbot role vars  # noqa: run-once
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - "{{ ansible_roles_path }}/vpnserver/vars/main.yml"
        - "{{ ansible_roles_path }}/vpnserver/vars/secrets.yml"
        - "{{ ansible_roles_path }}/subnginx3xui/vars/main.yml"
        - "{{ ansible_roles_path }}/subnginx3xui/vars/secrets.yml"
        - "{{ ansible_roles_path }}/untilwall/vars/main.yml"
        - "{{ ansible_roles_path }}/untilwall/vars/secrets.yml"
        - "{{ ansible_roles_path }}/semaphore/vars/main.yml"
        - "{{ ansible_roles_path }}/semaphore/vars/secrets.yml"
        - "{{ ansible_roles_path }}/lampa/vars/main.yml"
        - "{{ ansible_roles_path }}/lampa/vars/secrets.yml"
        - "{{ ansible_roles_path }}/trackertop/vars/main.yml"
        - "{{ ansible_roles_path }}/trackertop/vars/secrets.yml"
        - "{{ ansible_roles_path }}/vdl/vars/main.yml"
        - "{{ ansible_roles_path }}/vdl/vars/secrets.yml"
        - "{{ ansible_roles_path }}/common/vars/main.yml"
        - "{{ ansible_roles_path }}/common/vars/secrets.yml"
      failed_when: false
      delegate_to: localhost
      run_once: true
      tags: [always]

    # Load host_vars if exists
    - name: Load host_vars
      ansible.builtin.include_vars: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.yml"
      failed_when: false
      tags: [always]
  tasks:
    - name: Run vpnserver certbot tasks
      ansible.builtin.include_role:
        name: vpnserver
        tasks_from: certbot.yml
      when:
        - inventory_hostname in groups['vpnserver_role'] | default([])
        - inventory_hostname != 'ru2'  # у ru2 свой блок ниже: systemd-nginx и /server/certbot
      tags: [certbot, vpnserver]

    - name: Run subnginx3xui certbot tasks
      ansible.builtin.include_role:
        name: subnginx3xui
        tasks_from: certbot.yml
      when: inventory_hostname in groups['subnginx3xui_role'] | default([])
      tags: [certbot, subnginx3xui]

    - name: Run untilwall certbot tasks
      ansible.builtin.include_role:
        name: untilwall
        tasks_from: certbot.yml
      when: inventory_hostname in groups['untilwall_role'] | default([])
      tags: [certbot, untilwall]

    - name: Run semaphore certbot tasks
      ansible.builtin.include_role:
        name: semaphore
        tasks_from: certbot.yml
      when: inventory_hostname in groups['semaphore_role'] | default([])
      tags: [certbot, semaphore]

    - name: Run lampa certbot tasks
      ansible.builtin.include_role:
        name: lampa
        tasks_from: certbot.yml
      when: inventory_hostname in groups['lampa_role'] | default([])
      tags: [certbot, lampa]

    - name: Run trackertop certbot tasks
      ansible.builtin.include_role:
        name: trackertop
        tasks_from: certbot.yml
      when: inventory_hostname in groups['trackertop_role'] | default([])
      tags: [certbot, trackertop]

    - name: Run vdl certbot tasks
      ansible.builtin.include_role:
        name: vdl
        tasks_from: certbot.yml
      when: inventory_hostname in groups['vdl_role'] | default([])
      tags: [certbot, vdl]

    # ru2: веб-хост (ru2-jwt + прокси /plex/), certbot standalone c
    # остановкой systemd-nginx; сертификат живёт в /server/certbot
    # (выпущен вручную до ансибла, путь сохранён)
    - name: Run ru2 certbot tasks
      ansible.builtin.include_role:
        name: common
        tasks_from: certbot.yml
      vars:
        common_domain_name: "ru2.0x3654.com"
        common_cert_path: "/server/certbot"
        common_up_handler_name: "Reload nginx"
        common_down_handler_name: "Reload nginx"
        common_telegram_notify_enabled: false
      when: inventory_hostname == 'ru2'
      tags: [certbot, ru2]
