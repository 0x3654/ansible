---
# One-time provisioning of tracker-top on es: compose + cert + nginx + deploy.
# Docker/nginx уже стоят на es (роль lampa) — ставим только недостающее.
- name: Provision tracker-top on a fresh host
  hosts: trackertop_role
  vars:
    ansible_roles_path: "{{ playbook_dir }}/../roles"
  pre_tasks:
    - name: Include trackertop role vars
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - "{{ ansible_roles_path }}/trackertop/vars/main.yml"
        - "{{ ansible_roles_path }}/trackertop/vars/secrets.yml"
        - "{{ ansible_roles_path }}/trackertop/defaults/main.yml"
        - "{{ ansible_roles_path }}/common/vars/main.yml"
      failed_when: false
      delegate_to: localhost
      tags: [always]

    - name: Load host_vars if exists
      ansible.builtin.include_vars: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.yml"
      failed_when: false
      tags: [always]

  tasks:
    - name: Copy compose file
      ansible.builtin.include_role:
        name: trackertop
        tasks_from: filescopy.yml

    - name: Obtain TLS certificate
      ansible.builtin.include_role:
        name: trackertop
        tasks_from: certbot.yml

    - name: Configure system nginx site
      ansible.builtin.include_role:
        name: trackertop
        tasks_from: nginx.yml

    - name: Reload nginx now so the 443 vhost is active before the container starts
      ansible.builtin.meta: flush_handlers

    - name: Bring up tracker-top stack (first run)
      ansible.builtin.command:
        cmd: "{{ common_compose_command | default('docker compose') }} up -d"
        chdir: "{{ path }}"
      register: trackertop_first_up
      changed_when: >-
        trackertop_first_up.stdout is search('Creating')
        or trackertop_first_up.stdout is search('Starting')

    - name: Run deploy (pull + health-check)
      ansible.builtin.include_role:
        name: trackertop
        tasks_from: deploy.yml
