---
# sync-macs (mark3): единый двусторонний синк маков — один шаблон Semaphore,
# ночной запуск (шедулер ~06:2x, локальное время). Один запуск = маки сошлись.
#
# Порядок фаз ВНУТРИ плейбука фиксированный (и единственно правильный):
#   1. гвардии дисков обоих приёмников (оценки push/pull через rsync --dry-run)
#   2. pull конфигов citrus→moro (--update --checksum, реальная разница) — ДО collect,
#      иначе деплой снимка затирал бы правки citrus
#   3. collect: живые конфиги moro (уже сошедшиеся) → файлы роли dotfiles (git-история)
#   4. push moro→citrus: ~/code (+--update), fonts, ghostty, apps-разница, ~/.claude
#   5. pull citrus→moro: ~/code, fonts, ~/.claude (новее побеждает, delete нигде)
#   6. deploy конфигов на citrus из роли (cursor/bash) + ssh-дружба
#   7. отдельный плей: приложения citrus, отсутствующие на moro → moro
#
# Конфликт на файле: чексумма (нет разницы — не едем) + дата (новее побеждает).
# Правили один файл на обоих — выигрывает свежий, старое молча теряется: для
# критичного — git, не rsync. Удаления не синкаются (delete: false везде).
# .git: работает, пока на citrus не коммитят в те же репо.
#
# Полное зеркало-пересборка citrus — ДРУГОЙ джоб, только руками:
#   playbooks/sync-macbook.yml + sync_wipe=true (шаблон [wipe] в Semaphore).
#
# Excludes едины на все направления: playbooks/vars/sync-excludes.yml.

- name: sync macs — moro ⇄ citrus, двусторонний обмен
  hosts: citrus
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/vars/sync-excludes.yml"
  vars:
    source_host: moro
    sync_tailnet_domain: koi-uaru.ts.net
    sync_dotfiles_dir: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/code/ansible"
    _moro_home: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}"
    _citrus_home: "{{ ansible_env.HOME }}"

    # Разница приложений moro→citrus: что НЕ едет на citrus (см. sync-macbook.yml).
    sync_apps_exclude:
      - AnyDesk
      - AppCleaner
      - Blackmagic Disk Speed Test
      - Xcode
      - Parallels Desktop
      - Parallels Toolbox
      - Steam
      - Heroic
      - GameHub
      - OBS
      - Ollama
      - DBeaver
      - iMazing
      - vibe
      - Nebula for Mac
      - Keynote Creator Studio
      - Pages Creator Studio
      - Numbers Creator Studio
      - Sigil
      - balenaEtcher
      - Airmine Pollen

  tasks:
    - name: TG-креды для оповещений (vault manage — бот watchtower)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/manage/vars/secrets.yml"
      ignore_errors: true

    - name: sync macs (block ради rescue-оповещения в ТГ)
      block:
        - name: Директории на citrus
          file:
            path: "{{ _citrus_home }}/{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - code
            - Library/Fonts
            - .claude/projects
            - .config/ghostty

        - name: Директории на moro
          file:
            path: "{{ _moro_home }}/{{ item }}"
            state: directory
            mode: "0755"
          delegate_to: "{{ source_host }}"
          loop:
            - code
            - Library/Fonts
            - .claude/projects
            - .claude/skills
            - .claude/hooks
            - .config/ghostty

        # ── гвардии дисков обоих приёмников ─────────────────────────────────────
        - name: Guard — диск citrus до (statvfs, не df)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - 'import os,json; s=os.statvfs("{{ _citrus_home }}/code"); print(json.dumps({"avail_kb": s.f_frsize*s.f_bavail//1024, "total_kb": s.f_frsize*s.f_blocks//1024, "used_pct": round(100*(s.f_blocks-s.f_bavail)/s.f_blocks)}))'
          register: _disk_citrus_pre
          changed_when: false

        - name: Guard — оценка объёма push moro→citrus (rsync --dry-run --stats --update)
          ansible.builtin.command:
            argv: "{{ ['rsync', '--archive', '--dry-run', '--stats', '--update',
                        '--rsh=ssh -S none -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null']
                       + sync_rsync_common + sync_code_excludes
                       + [_moro_home + '/code/', _citrus_rsync + ':' + _citrus_home + '/code/'] }}"
          vars:
            _citrus_rsync: "{{ ansible_user | default('m') }}@{{ inventory_hostname }}.{{ sync_tailnet_domain }}"
          delegate_to: "{{ source_host }}"
          register: _est_push
          until: _est_push.rc == 0
          retries: 2
          delay: 15
          changed_when: false

        - name: Guard — объём push (байт)
          ansible.builtin.set_fact:
            sync_push_bytes: "{{ _est_push.stdout | regex_findall('Total transferred file size: ([0-9,]+)') | first | replace(',', '') | int }}"

        - name: Guard — citrus не уйдёт за 90%
          vars:
            _avail_kb: "{{ (_disk_citrus_pre.stdout | from_json).avail_kb }}"
            _total_kb: "{{ (_disk_citrus_pre.stdout | from_json).total_kb }}"
            _need_kb: "{{ (sync_push_bytes | int * 1.25 / 1024) | int + (_total_kb | int * 0.10) | int }}"
          ansible.builtin.assert:
            that: "_avail_kb | int >= _need_kb | int"
            fail_msg: >-
              Диск citrus переполнится: свободно {{ (_avail_kb | int / 1048576) | round(1) }}Г,
              push ~{{ (sync_push_bytes | int / 1073741824) | round(1) }}Г (×1.25 с запасом),
              а ≥10% из {{ (_total_kb | int / 1048576) | round(0) }}Г обязано остаться свободным.

        - name: Guard — диск moro до (statvfs)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - 'import os,json; s=os.statvfs("{{ _moro_home }}/code"); print(json.dumps({"avail_kb": s.f_frsize*s.f_bavail//1024, "total_kb": s.f_frsize*s.f_blocks//1024, "used_pct": round(100*(s.f_blocks-s.f_bavail)/s.f_blocks)}))'
          delegate_to: "{{ source_host }}"
          register: _disk_moro_pre
          changed_when: false

        - name: Guard — оценка объёма pull citrus→moro (rsync --dry-run --stats --update)
          ansible.builtin.command:
            argv: "{{ ['rsync', '--archive', '--dry-run', '--stats', '--update',
                        '--rsh=ssh -S none -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null']
                       + sync_rsync_common + sync_code_excludes
                       + [ansible_user | default('m') + '@' + inventory_hostname + '.' + sync_tailnet_domain + ':/Users/' + (ansible_user | default('m')) + '/code/', _moro_home + '/code/'] }}"
          delegate_to: "{{ source_host }}"
          register: _est_pull
          until: _est_pull.rc == 0
          retries: 2
          delay: 15
          changed_when: false

        - name: Guard — объём pull (байт)
          ansible.builtin.set_fact:
            sync_pull_bytes: "{{ _est_pull.stdout | regex_findall('Total transferred file size: ([0-9,]+)') | first | replace(',', '') | int }}"

        - name: Guard — moro не уйдёт за 90%
          vars:
            _avail_kb: "{{ (_disk_moro_pre.stdout | from_json).avail_kb }}"
            _total_kb: "{{ (_disk_moro_pre.stdout | from_json).total_kb }}"
            _need_kb: "{{ (sync_pull_bytes | int * 1.25 / 1024) | int + (_total_kb | int * 0.10) | int }}"
          ansible.builtin.assert:
            that: "_avail_kb | int >= _need_kb | int"
            fail_msg: >-
              Диск moro переполнится: свободно {{ (_avail_kb | int / 1048576) | round(1) }}Г,
              pull ~{{ (sync_pull_bytes | int / 1073741824) | round(1) }}Г (×1.25 с запасом),
              а ≥10% из {{ (_total_kb | int / 1048576) | round(0) }}Г обязано остаться свободным.

        # ── фаза 1: конфиги citrus → moro (ДО collect — иначе правки citrus затрёт деплой) ──
        - name: Конфиги citrus→moro — ghostty (реальная разница)
          synchronize:
            src: "{{ _citrus_home }}/.config/ghostty/"
            dest: "{{ _moro_home }}/.config/ghostty/"
            mode: pull
            rsync_opts: "{{ sync_rsync_common + ['--update', '--checksum'] }}"
            checksum: false
            delete: false
          delegate_to: "{{ source_host }}"

        - name: Конфиги citrus→moro — staging для cursor (пробелы в remote-пути openrsync не квотит)
          ansible.builtin.command:
            argv: ["mkdir", "-p", "{{ _citrus_home }}/.cursor-sync-staging"]
          changed_when: false

        - name: Конфиги citrus→moro — копия cursor-настроек в staging
          ansible.builtin.command:
            argv:
              - cp
              - "{{ _citrus_home }}/Library/Application Support/Cursor/User/{{ item }}"
              - "{{ _citrus_home }}/.cursor-sync-staging/{{ item }}"
          loop: [settings.json, keybindings.json]
          changed_when: false

        - name: Конфиги citrus→moro — pull staging
          synchronize:
            src: "{{ _citrus_home }}/.cursor-sync-staging/"
            dest: "{{ _moro_home }}/.cursor-sync-staging/"
            mode: pull
            rsync_opts: "{{ sync_rsync_common + ['--update', '--checksum'] }}"
            checksum: false
            delete: false
          delegate_to: "{{ source_host }}"

        - name: Конфиги citrus→moro — раскладка cursor на moro (локальный mv, пробелы безопасны)
          ansible.builtin.command:
            argv:
              - mv
              - "{{ _moro_home }}/.cursor-sync-staging/{{ item }}"
              - "{{ _moro_home }}/Library/Application Support/Cursor/User/{{ item }}"
          loop: [settings.json, keybindings.json]
          delegate_to: "{{ source_host }}"
          changed_when: false

        - name: Конфиги citrus→moro — bash dotfiles
          synchronize:
            src: "{{ _citrus_home }}/{{ item }}"
            dest: "{{ _moro_home }}/{{ item }}"
            mode: pull
            rsync_opts: "{{ sync_rsync_common + ['--update', '--checksum'] }}"
            checksum: false
            delete: false
          loop: [.bashrc, .bash_profile]
          delegate_to: "{{ source_host }}"

        # ── фаза 2: collect moro → роль dotfiles (в git-историю; moro уже сошёлся) ──
        - name: Collect живых настроек moro в роль
          block:
            - name: Collect Cursor settings
              ansible.builtin.copy:
                remote_src: true
                src: "{{ _moro_home }}/Library/Application Support/Cursor/User/settings.json"
                dest: "{{ sync_dotfiles_dir }}/roles/dotfiles/files/dotfiles/macos/apps/cursor/settings.json"
                mode: "0644"
            - name: Collect Cursor keybindings
              ansible.builtin.copy:
                remote_src: true
                src: "{{ _moro_home }}/Library/Application Support/Cursor/User/keybindings.json"
                dest: "{{ sync_dotfiles_dir }}/roles/dotfiles/files/dotfiles/macos/apps/cursor/keybindings.json"
                mode: "0644"
            - name: Collect Ghostty config
              ansible.builtin.copy:
                remote_src: true
                src: "{{ _moro_home }}/.config/ghostty/config"
                dest: "{{ sync_dotfiles_dir }}/roles/dotfiles/files/dotfiles/macos/apps/ghostty/config"
                mode: "0644"
            - name: Collect Ghostty icons
              ansible.builtin.copy:
                remote_src: true
                src: "{{ item }}"
                dest: "{{ sync_dotfiles_dir }}/roles/dotfiles/files/dotfiles/macos/apps/ghostty/{{ item | basename }}"
                mode: "0644"
              with_fileglob:
                - "{{ _moro_home }}/.config/ghostty/*.icns"
            - name: Collect bash dotfiles
              ansible.builtin.copy:
                remote_src: true
                src: "{{ _moro_home }}/{{ item }}"
                dest: "{{ sync_dotfiles_dir }}/roles/dotfiles/files/dotfiles/bash/{{ item | basename }}"
                mode: "0644"
              loop: [.bashrc, .bash_profile]
          delegate_to: "{{ source_host }}"

        # ── фаза 3: push moro → citrus ──────────────────────────────────────────
        - name: Push ~/code moro→citrus (--update, citrus-новее не трогаем)
          synchronize:
            src: "{{ _moro_home }}/code/"
            dest: "{{ _citrus_home }}/code/"
            mode: push
            rsync_opts: "{{ sync_rsync_common + sync_code_excludes + ['--update'] }}"
            checksum: true
            delete: false
          delegate_to: "{{ source_host }}"

        - name: Push fonts moro→citrus
          synchronize:
            src: "{{ _moro_home }}/Library/Fonts/"
            dest: "{{ _citrus_home }}/Library/Fonts/"
            mode: push
            rsync_opts: "{{ sync_rsync_common + ['--update'] }}"
            checksum: true
            delete: false
          delegate_to: "{{ source_host }}"

        - name: Push ghostty moro→citrus (moro уже сошёлся с citrus)
          synchronize:
            src: "{{ _moro_home }}/.config/ghostty/"
            dest: "{{ _citrus_home }}/.config/ghostty/"
            mode: push
            rsync_opts: "{{ sync_rsync_common + ['--update'] }}"
            checksum: true
            delete: false
          delegate_to: "{{ source_host }}"

        - name: Apps на moro (эталон)
          ansible.builtin.command: ls {{ item }}
          loop: [/Applications, "{{ _moro_home }}/Applications"]
          delegate_to: "{{ source_host }}"
          register: _src_apps
          changed_when: false
          failed_when: false

        - name: Apps на citrus
          ansible.builtin.command: ls {{ item }}
          loop: [/Applications, "{{ _citrus_home }}/Applications"]
          register: _dst_apps
          changed_when: false
          failed_when: false

        - name: Union apps на citrus
          ansible.builtin.set_fact:
            _dst_all_apps: >-
              {{ (_dst_apps.results | map(attribute='stdout_lines') | flatten | select('match', '.*[.]app$'))
                 | map('regex_replace', '[.]app$', '') | list }}

        - name: App-разница moro→citrus
          ansible.builtin.set_fact:
            _apps_new_root: >-
              {{ _src_apps.results[0].stdout_lines | select('match', '.*[.]app$')
                 | map('regex_replace', '[.]app$', '') | list | difference(sync_apps_exclude) | difference(_dst_all_apps) }}
            _apps_new_home: >-
              {{ _src_apps.results[1].stdout_lines | select('match', '.*[.]app$')
                 | map('regex_replace', '[.]app$', '') | list | difference(sync_apps_exclude) | difference(_dst_all_apps) }}

        - name: Push app-разницы moro → /Applications citrus
          synchronize:
            src: "/Applications/{{ item }}.app"
            dest: "/Applications/"
            mode: push
            rsync_opts: "{{ sync_rsync_common }}"
            delete: false
          loop: "{{ _apps_new_root }}"
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ source_host }}"

        - name: Push app-разницы moro → ~/Applications citrus
          synchronize:
            src: "{{ _moro_home }}/Applications/{{ item }}.app"
            dest: "{{ _citrus_home }}/Applications/"
            mode: push
            rsync_opts: "{{ sync_rsync_common }}"
            delete: false
          loop: "{{ _apps_new_home }}"
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ source_host }}"

        # ── merge md-файлов claude ДО rsync: журнал/правила правятся сессиями
        #    на обеих машинах, mtime-LWW терял бы записи (см. tasks/sync-claude-merge.yml)
        - name: Claude md merge (журнал/правила, обе стороны)
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/sync-claude-merge.yml"
          vars:
            _claude_merge_a_home: "{{ _moro_home }}"
            _claude_merge_a_host: "{{ source_host }}"
            _claude_merge_b_home: "{{ _citrus_home }}"

        - name: Push ~/.claude moro→citrus (additive whitelist)
          synchronize:
            src: "{{ _moro_home }}/.claude/"
            dest: "{{ _citrus_home }}/.claude/"
            mode: push
            rsync_opts: "{{ sync_rsync_common + sync_claude_includes + ['--update'] }}"
            checksum: true
            delete: false
          delegate_to: "{{ source_host }}"

        # ── фаза 4: pull citrus → moro ──────────────────────────────────────────
        - name: Pull ~/code citrus→moro
          synchronize:
            src: "{{ _citrus_home }}/code/"
            dest: "{{ _moro_home }}/code/"
            mode: pull
            rsync_opts: "{{ sync_rsync_common + sync_code_excludes + ['--update', '--checksum', '--itemize-changes'] }}"
            checksum: false
            delete: false
          delegate_to: "{{ source_host }}"

        - name: Pull fonts citrus→moro
          synchronize:
            src: "{{ _citrus_home }}/Library/Fonts/"
            dest: "{{ _moro_home }}/Library/Fonts/"
            mode: pull
            rsync_opts: "{{ sync_rsync_common + ['--update', '--checksum'] }}"
            checksum: false
            delete: false
          delegate_to: "{{ source_host }}"

        - name: Pull ~/.claude citrus→moro (additive whitelist)
          synchronize:
            src: "{{ _citrus_home }}/.claude/"
            dest: "{{ _moro_home }}/.claude/"
            mode: pull
            rsync_opts: "{{ sync_rsync_common + sync_claude_includes + ['--update', '--checksum', '--itemize-changes'] }}"
            checksum: false
            delete: false
          delegate_to: "{{ source_host }}"

        # ── фаза 5: deploy конфигов на citrus + ssh-дружба ─────────────────────
        - name: Deploy Cursor settings на citrus
          ansible.builtin.copy:
            remote_src: true
            src: "{{ _citrus_home }}/code/ansible/roles/dotfiles/files/dotfiles/macos/apps/cursor/{{ item }}"
            dest: "{{ _citrus_home }}/Library/Application Support/Cursor/User/{{ item }}"
            mode: "0644"
          loop: [settings.json, keybindings.json]

        - name: Deploy bash dotfiles на citrus
          ansible.builtin.copy:
            remote_src: true
            src: "{{ _citrus_home }}/code/ansible/roles/dotfiles/files/dotfiles/bash/{{ item }}"
            dest: "{{ _citrus_home }}/{{ item }}"
            mode: "0644"
          loop: [.bashrc, .bash_profile]

        - name: SSH-дружба moro ↔ citrus
          block:
            - name: Pubkey эталона (moro)
              ansible.builtin.slurp:
                src: "{{ _moro_home }}/.ssh/id_ed25519.pub"
              register: _src_pubkey
              delegate_to: "{{ source_host }}"
            - name: Pubkey citrus
              ansible.builtin.slurp:
                src: "{{ _citrus_home }}/.ssh/id_ed25519.pub"
              register: _dst_pubkey
            - name: Ключ moro → authorized_keys citrus
              ansible.builtin.authorized_key:
                user: "{{ ansible_user | default('m') }}"
                key: "{{ _src_pubkey.content | b64decode | trim }}"
                state: present
            - name: Ключ citrus → authorized_keys moro
              ansible.builtin.authorized_key:
                user: "{{ hostvars[source_host].ansible_user | default('m') }}"
                key: "{{ _dst_pubkey.content | b64decode | trim }}"
                state: present
              delegate_to: "{{ source_host }}"
            - name: ssh-config блок moro на citrus
              ansible.builtin.blockinfile:
                path: "{{ _citrus_home }}/.ssh/config"
                state: present
                create: true
                mode: "0600"
                insertafter: BOF
                marker: "# {mark} ANSIBLE MANAGED mac-pair {{ source_host }}"
                block: |
                  Host {{ source_host }}
                      HostName {{ source_host }}.{{ sync_tailnet_domain }}
                      User {{ hostvars[source_host].ansible_user | default('m') }}
            - name: ssh-config блок citrus на moro
              ansible.builtin.blockinfile:
                path: "{{ _moro_home }}/.ssh/config"
                state: present
                create: true
                mode: "0600"
                insertafter: BOF
                marker: "# {mark} ANSIBLE MANAGED mac-pair {{ inventory_hostname }}"
                block: |
                  Host {{ inventory_hostname }}
                      HostName {{ inventory_hostname }}.{{ sync_tailnet_domain }}
                      User {{ ansible_user | default('m') }}
              delegate_to: "{{ source_host }}"

        # ── отчёт ───────────────────────────────────────────────────────────────
        - name: Диски после (statvfs, оба)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - 'import os,json; s=os.statvfs("{{ _citrus_home }}/code"); print(json.dumps({"avail_kb": s.f_frsize*s.f_bavail//1024, "used_pct": round(100*(s.f_blocks-s.f_bavail)/s.f_blocks)}))'
          register: _disk_citrus_post
          changed_when: false

        - name: Диск moro после (statvfs)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - 'import os,json; s=os.statvfs("{{ _moro_home }}/code"); print(json.dumps({"avail_kb": s.f_frsize*s.f_bavail//1024, "used_pct": round(100*(s.f_blocks-s.f_bavail)/s.f_blocks)}))'
          delegate_to: "{{ source_host }}"
          register: _disk_moro_post
          changed_when: false

        - name: TG ✅ маки сошлись
          ansible.builtin.uri:
            url: "https://api.telegram.org/bot{{ manage_watchtower_tg_wt_bot_token | default('') }}/sendMessage"
            method: POST
            body_format: json
            body:
              chat_id: "{{ manage_watchtower_tg_wt_chat_id | default('') }}"
              text: >-
                ✅ sync-macs moro⇄citrus: сошлись.
                push ~{{ (sync_push_bytes | default(0) | int / 1073741824) | round(2) }}Г, pull ~{{ (sync_pull_bytes | default(0) | int / 1073741824) | round(2) }}Г;
                moro {{ (_disk_moro_pre.stdout | from_json).used_pct }}→{{ (_disk_moro_post.stdout | from_json).used_pct }}%,
                citrus {{ (_disk_citrus_pre.stdout | from_json).used_pct }}→{{ (_disk_citrus_post.stdout | from_json).used_pct }}% занято.
            status_code: 200
            timeout: 15
          delegate_to: localhost
          run_once: true
          when: manage_watchtower_tg_wt_bot_token is defined
          failed_when: false

      rescue:
        - name: TG ❌ sync-macs упал
          ansible.builtin.uri:
            url: "https://api.telegram.org/bot{{ manage_watchtower_tg_wt_bot_token | default('') }}/sendMessage"
            method: POST
            body_format: json
            body:
              chat_id: "{{ manage_watchtower_tg_wt_chat_id | default('') }}"
              text: >-
                ❌ sync-macs moro⇄citrus упал на «{{ ansible_failed_task.name }}»:
                {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('нет деталей')) | truncate(350) }}
            status_code: 200
            timeout: 15
          delegate_to: localhost
          run_once: true
          when: manage_watchtower_tg_wt_bot_token is defined
          failed_when: false

        - name: Проброс ошибки дальше (Semaphore увидит fail)
          ansible.builtin.fail:
            msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('упало')) }}"

- name: Apps citrus → moro (есть на citrus, нет на moro)
  hosts: moro
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/vars/sync-excludes.yml"
  vars:
    _src_host: citrus
    _src_user: "{{ hostvars[_src_host].ansible_user | default('m') }}"
    # pkg-приложения от root на citrus: юзер не читает бандл (rsync Permission denied),
    # на moro ставить вручную.
    sync_apps_back_exclude:
      - Dell Display and Peripheral Manager

  tasks:
    - name: TG-креды для оповещений (vault manage — бот watchtower)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/manage/vars/secrets.yml"
      ignore_errors: true

    - name: Приложения citrus → moro (block ради rescue-оповещения в ТГ)
      block:
        - name: Apps на citrus (источник)
          ansible.builtin.command: ls {{ item }}
          loop: [/Applications, "/Users/{{ _src_user }}/Applications"]
          delegate_to: "{{ _src_host }}"
          register: _src_apps
          changed_when: false

        - name: Apps на moro (приёмник)
          ansible.builtin.command: ls {{ item }}
          loop: [/Applications, "{{ ansible_env.HOME }}/Applications"]
          register: _dst_apps
          changed_when: false
          failed_when: false

        - name: Union apps на moro
          ansible.builtin.set_fact:
            _dst_all_apps: >-
              {{ (_dst_apps.results | map(attribute='stdout_lines') | flatten | select('match', '.*[.]app$'))
                 | map('regex_replace', '[.]app$', '') | list }}

        - name: Разница (есть на citrus, нет на moro)
          ansible.builtin.set_fact:
            _apps_new_root: >-
              {{ _src_apps.results[0].stdout_lines | select('match', '.*[.]app$')
                 | map('regex_replace', '[.]app$', '') | list
                 | difference(_dst_all_apps) | difference(sync_apps_back_exclude) }}
            _apps_new_home: >-
              {{ _src_apps.results[1].stdout_lines | select('match', '.*[.]app$')
                 | map('regex_replace', '[.]app$', '') | list
                 | difference(_dst_all_apps) | difference(sync_apps_back_exclude) }}

        - name: Объём новых приложений (du, для гвардии)
          ansible.builtin.command: du -sk {{ item }}
          loop: "{{ _apps_new_root | map('regex_replace', '(.+)', '/Applications/\\1.app') | list
                    + _apps_new_home | map('regex_replace', '(.+)', '/Users/' + _src_user + '/Applications/\\1.app') | list }}"
          loop_control:
            label: "{{ item | basename }}"
          delegate_to: "{{ _src_host }}"
          register: _apps_du
          changed_when: false
          failed_when: false

        - name: Место на moro под приложения (statvfs)
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - 'import os,json; s=os.statvfs("/Applications"); print(json.dumps({"avail_kb": s.f_frsize*s.f_bavail//1024, "total_kb": s.f_frsize*s.f_blocks//1024}))'
          register: _disk_moro
          changed_when: false

        - name: Хватит ли места под приложения (≤90%)
          vars:
            _apps_kb: "{{ _apps_du.results | map(attribute='stdout') | map('regex_findall', '^[0-9]+') | flatten | map('int') | sum | int }}"
            _avail_kb: "{{ (_disk_moro.stdout | from_json).avail_kb }}"
            _total_kb: "{{ (_disk_moro.stdout | from_json).total_kb }}"
          ansible.builtin.assert:
            that: "_avail_kb | int >= _apps_kb | int + (_total_kb | int * 0.10) | int"
            fail_msg: >-
              Приложения с citrus (~{{ (_apps_kb | int / 1048576) | round(1) }}Г) не влезут на moro:
              свободно {{ (_avail_kb | int / 1048576) | round(1) }}Г, ≥10% из {{ (_total_kb | int / 1048576) | round(0) }}Г — неприкосновенно.

        - name: Push новых приложений citrus → /Applications moro
          synchronize:
            src: "/Applications/{{ item }}.app"
            dest: "/Applications/"
            mode: push
            rsync_opts: "{{ sync_rsync_common }}"
            delete: false
          loop: "{{ _apps_new_root }}"
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ _src_host }}"

        - name: Push новых приложений citrus → ~/Applications moro
          synchronize:
            src: "/Users/{{ _src_user }}/Applications/{{ item }}.app"
            dest: "{{ ansible_env.HOME }}/Applications/"
            mode: push
            rsync_opts: "{{ sync_rsync_common }}"
            delete: false
          loop: "{{ _apps_new_home }}"
          loop_control:
            label: "{{ item }}"
          delegate_to: "{{ _src_host }}"

        - name: TG ✅ приложения вернулись
          ansible.builtin.uri:
            url: "https://api.telegram.org/bot{{ manage_watchtower_tg_wt_bot_token | default('') }}/sendMessage"
            method: POST
            body_format: json
            body:
              chat_id: "{{ manage_watchtower_tg_wt_chat_id | default('') }}"
              text: >-
                ✅ apps citrus→moro: {{ _apps_new_root | length + _apps_new_home | length }} новых приложений.
            status_code: 200
            timeout: 15
          delegate_to: localhost
          run_once: true
          when: manage_watchtower_tg_wt_bot_token is defined
          failed_when: false

      rescue:
        - name: TG ❌ возврат приложений упал
          ansible.builtin.uri:
            url: "https://api.telegram.org/bot{{ manage_watchtower_tg_wt_bot_token | default('') }}/sendMessage"
            method: POST
            body_format: json
            body:
              chat_id: "{{ manage_watchtower_tg_wt_chat_id | default('') }}"
              text: >-
                ❌ apps citrus→moro упал на «{{ ansible_failed_task.name }}»:
                {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('нет деталей')) | truncate(350) }}
            status_code: 200
            timeout: 15
          delegate_to: localhost
          run_once: true
          when: manage_watchtower_tg_wt_bot_token is defined
          failed_when: false

        - name: Проброс ошибки дальше (Semaphore увидит fail)
          ansible.builtin.fail:
            msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('упало')) }}"
