---
# One-time provisioning of lampa (nnm-rss) on a fresh host (full role).
# For routine image redeploys use deploy-lampa.yml.
- name: Provision lampa (nnm-rss) on a fresh host
  hosts: lampa_role
  vars:
    ansible_roles_path: "{{ playbook_dir }}/../roles"
  pre_tasks:
    - name: Include lampa role vars
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - "{{ ansible_roles_path }}/lampa/vars/main.yml"
        - "{{ ansible_roles_path }}/lampa/vars/secrets.yml"
        - "{{ ansible_roles_path }}/lampa/defaults/main.yml"
        - "{{ ansible_roles_path }}/common/vars/main.yml"
      failed_when: false
      delegate_to: localhost
      tags: [always]

    - name: Load host_vars if exists
      ansible.builtin.include_vars: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.yml"
      failed_when: false
      tags: [always]

  tasks:
    - name: Install packages and docker repo
      ansible.builtin.include_role:
        name: lampa
        tasks_from: apt.yml

    - name: Copy compose before certbot (handlers need the project dir to exist)
      ansible.builtin.include_role:
        name: lampa
        tasks_from: filescopy.yml

    - name: Obtain TLS certificate
      ansible.builtin.include_role:
        name: lampa
        tasks_from: certbot.yml

    - name: Configure system nginx site
      ansible.builtin.include_role:
        name: lampa
        tasks_from: nginx.yml

    - name: Reload nginx now so the 443 vhost is active before the container starts
      ansible.builtin.meta: flush_handlers

    - name: Bring up lampa stack (first run, before health-check)
      ansible.builtin.command:
        cmd: "{{ common_compose_command | default('docker compose') }} up -d"
        chdir: "{{ path }}"
      register: lampa_first_up
      changed_when: >-
        lampa_first_up.stdout is search('Creating')
        or lampa_first_up.stdout is search('Recreating')
        or lampa_first_up.stdout is search('Starting')
        or lampa_first_up.stderr is search('Creating')
        or lampa_first_up.stderr is search('Started')

    - name: Configure firewall
      ansible.builtin.include_role:
        name: lampa
        tasks_from: firewall.yml

    - name: Run deploy (pull + health-check)
      ansible.builtin.include_role:
        name: lampa
        tasks_from: deploy.yml
