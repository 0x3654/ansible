---
# GISP Embeddings - Recompute semantic embeddings
- name: GISP Embeddings
  hosts: gisp_role
  gather_facts: false
  tasks:
    - name: Run embeddings-worker container
      ansible.builtin.command:
        cmd: docker compose --profile embeddings run --rm --pull always embeddings-worker
        chdir: "{{ gisp_project_src }}"
      environment:
        PATH: "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin"
      register: embeddings_result
      failed_when: false
      changed_when: false

    - name: Show embeddings output
      ansible.builtin.debug:
        msg:
          - "path: {{ gisp_project_src }}"
          - "rc: {{ embeddings_result.rc | default('<no rc — command did not run>') }}"
          - "msg: {{ embeddings_result.msg | default('') }}"
          - "stderr: {{ embeddings_result.stderr | default('') }}"
          - "stdout: {{ embeddings_result.stdout | default('') }}"

    - name: Send Telegram notification on failure
      ansible.builtin.shell: |
        set -a
        . "{{ gisp_project_src }}/.env"
        set +a
        . "{{ gisp_project_src }}/scripts/send_telegram.sh"
        printf 'path: %s\nstdout:\n%s\n--- stderr ---\n%s\n' "{{ gisp_project_src }}" "{{ embeddings_result.stdout }}" "{{ embeddings_result.stderr }}" > /tmp/gisp_embeddings_output.txt
        send_heartbeat "❌ <b>GISP Embeddings</b> ошибка (код {{ embeddings_result.rc | default('?') }}) path={{ gisp_project_src }}" "/tmp/gisp_embeddings_output.txt"
        rm -f /tmp/gisp_embeddings_output.txt
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      when: embeddings_result.rc != 0

    - name: Fail if embeddings container failed
      ansible.builtin.fail:
        msg: >-
          Embeddings failed (rc={{ embeddings_result.rc | default('undefined') }}, path={{ gisp_project_src }}).
          {{ embeddings_result.msg | default('') }}
          stderr: {{ embeddings_result.stderr | default('') }}
      when: (embeddings_result.rc | default(1)) != 0
