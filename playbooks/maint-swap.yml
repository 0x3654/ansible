---
- name: Add swap file on weak VPS (idempotent, skip if swap exists)
  hosts: "{{ target_hosts | default('all:!macbook') }}"
  become: true
  vars:
    swap_file: /swapfile
    # es: маленький диск (4.9G) — компактный своп; остальные — 1G
    swap_size_mb: "{{ 512 if inventory_hostname == 'es' else 1024 }}"
    swap_swappiness: 10

  tasks:
    - name: Check active swap
      ansible.builtin.command: swapon --show --noheadings
      register: swap_active
      changed_when: false

    - name: Configure swap
      when: swap_active.stdout | length == 0
      block:
        - name: Create swap file (dd — надёжнее fallocate для своп-файла)
          ansible.builtin.command: dd if=/dev/zero of={{ swap_file }} bs=1M count={{ swap_size_mb }}
          args:
            creates: "{{ swap_file }}"

        - name: Lock down permissions
          ansible.builtin.file:
            path: "{{ swap_file }}"
            owner: root
            group: root
            mode: "0600"

        - name: Format as swap
          ansible.builtin.command: mkswap {{ swap_file }}
          register: swap_mkswap
          changed_when: "'Setting up swapspace' in swap_mkswap.stdout"

        - name: Enable swap
          ansible.builtin.command: swapon {{ swap_file }}

        - name: Persist in fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: "{{ swap_file }} none swap sw 0 0"
            state: present

    - name: Tune swappiness (своп только под реальным давлением памяти)
      ansible.builtin.sysctl:
        name: vm.swappiness
        value: "{{ swap_swappiness | string }}"
        state: present
        sysctl_set: true
        reload: true

    - name: Show result
      ansible.builtin.command: free -m
      register: swap_free
      changed_when: false

    - name: Swap status
      ansible.builtin.debug:
        msg: "{{ swap_free.stdout_lines }}"
