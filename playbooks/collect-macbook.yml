---
# Собирает живые настройки приложений с эталона (moro) в файлы роли dotfiles.
# Односторонний обмен: настройки правятся на moro, collect обновляет снимок в репо.
#
# Запуск с moro:
#   ansible-playbook playbooks/collect-macbook.yml                  # всё
#   ansible-playbook playbooks/collect-macbook.yml --tags cursor
#   ansible-playbook playbooks/collect-macbook.yml --tags ghostty
#
# После collect: закоммитить submodule roles/dotfiles/files/dotfiles,
# затем на citrus — setup-macbook.yml -t configs (cursor уже стоит тегом cursor).
#
# Что собирается:
#   cursor  — settings.json + keybindings.json
#   ghostty — config + *.icns

- name: Collect live app settings from moro into dotfiles role
  hosts: "{{ src_host | default('moro') }}"
  gather_facts: true
  vars:
    apps_dir: "{{ playbook_dir }}/../roles/dotfiles/files/dotfiles/macos/apps"

  tasks:
    - name: Collect Cursor settings
      tags: cursor
      copy:
        remote_src: true
        src: "{{ ansible_env.HOME }}/Library/Application Support/Cursor/User/settings.json"
        dest: "{{ apps_dir }}/cursor/settings.json"
        mode: "0644"

    - name: Collect Cursor keybindings
      tags: cursor
      copy:
        remote_src: true
        src: "{{ ansible_env.HOME }}/Library/Application Support/Cursor/User/keybindings.json"
        dest: "{{ apps_dir }}/cursor/keybindings.json"
        mode: "0644"

    - name: Collect Ghostty config
      tags: ghostty
      copy:
        remote_src: true
        src: "{{ ansible_env.HOME }}/.config/ghostty/config"
        dest: "{{ apps_dir }}/ghostty/config"
        mode: "0644"

    - name: Collect Ghostty icons
      tags: ghostty
      copy:
        remote_src: true
        src: "{{ item }}"
        dest: "{{ apps_dir }}/ghostty/{{ item | basename }}"
        mode: "0644"
      with_fileglob:
        - "{{ ansible_env.HOME }}/.config/ghostty/*.icns"
