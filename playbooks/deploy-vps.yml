---
# Playbook to deploy VPN server and subnginx3xui roles
- name: Deploy VPS (vpnserver + subnginx3xui)
  hosts: vpnserver_role:subnginx3xui_role
  vars_files:
    - "{{ playbook_dir }}/../roles/vpnserver/vars/main.yml"
    - "{{ playbook_dir }}/../roles/vpnserver/vars/secrets.yml"
    - "{{ playbook_dir }}/../roles/subnginx3xui/vars/main.yml"
    - "{{ playbook_dir }}/../roles/subnginx3xui/vars/secrets.yml"
    - "{{ playbook_dir }}/../roles/common/vars/main.yml"
    - "{{ playbook_dir }}/../roles/common/vars/secrets.yml"
  vars:
    ansible_roles_path: "{{ playbook_dir }}/../roles"
  pre_tasks:

    # Guard: every committed submodule pointer must exist on its remote,
    # otherwise the Semaphore checkout dies with "upload-pack: not our ref"
    # and takes down every task of the project.
    - name: Verify submodule pointers are published
      ansible.builtin.command: bash ../scripts/check-submodules.sh
      args:
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      tags: [always]

    # Load host_vars if exists
    - name: Load host_vars
      ansible.builtin.include_vars: "{{ playbook_dir }}/../host_vars/{{ inventory_hostname }}.yml"
      failed_when: false
      tags: [always]
  tasks:
    - name: Run vpnserver role tasks
      ansible.builtin.include_role:
        name: vpnserver
      when: inventory_hostname in groups['vpnserver_role'] | default([])
      tags: [vpnserver]

    - name: Run subnginx3xui role tasks
      ansible.builtin.include_role:
        name: subnginx3xui
      when: inventory_hostname in groups['subnginx3xui_role'] | default([])
      tags: [subnginx3xui]
