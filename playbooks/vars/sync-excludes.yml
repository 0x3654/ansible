---
# ЕДИНЫЙ источник rsync-опций для sync-macbook.yml (снимок moro→citrus)
# и sync-macbook-back.yml (возврат нового с citrus→moro). Оба плейбука
# подключают этот файл через vars_files — правки только здесь.
#
# Машино-локальное и тяжёлое, что не ездит между маками (2026-09-12, ~95Г из
# 136Г ~/code на moro; ревизия по du-разборке): дампы/базы/выгрузки 1С (_bd_backup,
# createrra _bases + _config/.metadata, *.1CD/.dt/.cf-родители), данные сервисов gisp
# (postgres/dumps/files/модели), build/ везде, рантайм sLLM/_data, дистрибутивы
# arm1c/dists, бэкапы (config/server-backup, semaphore vps_backup), *.dmg.
# В сет вернулись (2026-09-12): opti-com/_config целиком (3.7Г) и XML-выгрузки
# createrra/_config/*XML* без .cf (~21.5Г) — анализ конфигураций на citrus.

sync_rsync_common:
  - "--archive"
  - "--human-readable"
  - "--exclude=.DS_Store"
  - "--exclude=node_modules/"
  - "--exclude=__pycache__/"
  - "--exclude=.venv/"
  - "--exclude=venv/"
  - "--exclude=*.pyc"

sync_code_excludes:
  - "--exclude=_bd_backup/"                   # 47Г pg-дампы 1С (маунт /backups контейнера pg1c)
  - "--exclude=_Work/createrra/_bases/"       # 16Г файловые базы 1С
  - "--exclude=_Work/createrra/_config/.metadata/"   # 10.8Г внутренности EDT-воркспейса (XML-выгрузки ЕДУТ)
  - "--exclude=Ext/ParentConfigurations/"     # 3.3Г .cf-дампы родительских конфигураций внутри XML-выгрузок
  - "--exclude=_Work/opti-com/gisp/dumps/"    # 7.2Г дампы миграций
  - "--exclude=_Work/opti-com/gisp/files/"    # 771М входные CSV-дампы
  - "--exclude=_Work/opti-com/gisp/services/postgres/"  # 7.6Г живая база (каталог = data/)
  - "--exclude=_Work/opti-com/gisp/services/semantic/model/"  # 921М веса (bin+safetensors — одна модель)
  - "--exclude=_Work/opti-com/gisp-gpu/model-onnx/"     # 449М onnx-экспорт, генерируется
  - "--exclude=build/"                        # билд-артефакты: starter 1.7Г, pulsesync 4.2Г, Xcode-проекты
  - "--exclude=.svelte-kit/"                  # кэш open-webui
  - "--exclude=sLLM/_data/"                   # 1Г рантайм open-webui (webui.db, vector_db)
  - "--exclude=arm1c/dists/"                  # 2.3Г дистрибутивы 1С
  - "--exclude=config/server-backup/"         # 1.3Г бэкапы homelab
  - "--exclude=docker/semaphore/vps_backup/"  # 1Г бэкапы semaphore
  - "--exclude=*.dmg"                         # скачанные инсталляторы
  - "--exclude=*.1CD"                         # базы вне _bases, на всякий
  - "--exclude=*.dt"

# ~/.claude: whitelist того, что ездит между маками (порядок важен — родители до
# содержимого, последним catch-all exclude). Рантайм (file-history, sessions, ide,
# backups, credentials) и local_settings.json остаются машинными.
sync_claude_includes:
  - "--include=/CLAUDE.md"
  - "--include=/CLAUDE-CHANGELOG.md"
  - "--include=/settings.json"
  - "--include=/skills/"
  - "--include=/skills/***"
  - "--include=/hooks/"
  - "--include=/hooks/***"
  - "--include=/projects/"
  - "--include=/projects/***"
  - "--exclude=*"
