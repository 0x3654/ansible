---
# Односторонний снимок с эталона (moro) на citrus:
# ~/code + ~/Library/Fonts + ~/.config/ghostty + ~/.claude/projects.
#
# Перед снимком собирает живые настройки приложений (cursor, ghostty) c moro
# в файлы роли dotfiles — они внутри ~/code и едут дальше rsync'ом.
# Коммитить сабмодуль dotfiles не обязательно — на обмен между маками гит не влияет.
#
# Run from moro (одна команда на всё):
#   ansible-playbook playbooks/sync-macbook.yml -e "src_host=moro dest_host=citrus"
#
# Свежий снимок-зеркало — сносит устаревший ~/code на dest (правки на dest теряются!):
#   ansible-playbook playbooks/sync-macbook.yml -e "src_host=moro dest_host=citrus sync_wipe=true"
#
# Dry-run:
#   ansible-playbook playbooks/sync-macbook.yml -e "src_host=moro dest_host=citrus dry_run=true"
# Только сбор настроек в репо (без копирования на citrus):
#   ansible-playbook playbooks/sync-macbook.yml -e "src_host=moro dest_host=citrus" --tags collect
#
# Не ездит между машинами (sync_code_excludes): файловые базы 1С (*.1CD/*.dt),
# живой postgres gisp, билд-артефакты starter — ~26Г из 73Г _Work.
# ~/.claude/projects (история диалогов Claude Code) — additive, без delete:
# сессии, начатые на citrus, при снимке не пропадают.
# Обратное направление (новее-по-mtime с citrus) — sync-macbook-back.yml.

- name: Snapshot ~/code from source Mac to dest Mac
  hosts: "{{ dest_host | default('citrus') }}"
  gather_facts: true
  vars:
    source_host: "{{ src_host | default('moro') }}"
    _dry_run: "{{ dry_run | default(false) | bool }}"
    _wipe: "{{ sync_wipe | default(false) | bool }}"

    _rsync_common:
      - "--archive"
      - "--human-readable"
      - "--exclude=.DS_Store"
      - "--exclude=node_modules/"
      - "--exclude=__pycache__/"
      - "--exclude=.venv/"
      - "--exclude=venv/"
      - "--exclude=*.pyc"

    # Тяжёлое, что не нужно на другой машине (16Г базы 1С + 8Г живой postgres + 2Г build)
    sync_code_excludes:
      - "--exclude=*.1CD"
      - "--exclude=*.dt"
      - "--exclude=_Work/opti-com/gisp/services/postgres/data/"
      - "--exclude=_Work/opti-com/gisp/services/starter/build/"

  tasks:
    - name: Wipe stale ~/code on dest (sync_wipe=true)
      file:
        path: "{{ ansible_env.HOME }}/code"
        state: absent
      when:
        - _wipe
        - not _dry_run

    - name: Create directories
      file:
        path: "{{ ansible_env.HOME }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - code
        - Library/Fonts
        - .claude/projects
        - .config/ghostty

    - name: Collect live settings from {{ source_host }} into role files
      # Контроллер = moro (эталон). Роль-файлы внутри ~/code — уедут снимком ниже.
      block:
        - name: Collect Cursor settings
          copy:
            remote_src: true
            src: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/Library/Application Support/Cursor/User/settings.json"
            dest: "{{ playbook_dir }}/../roles/dotfiles/files/dotfiles/macos/apps/cursor/settings.json"
            mode: "0644"

        - name: Collect Cursor keybindings
          copy:
            remote_src: true
            src: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/Library/Application Support/Cursor/User/keybindings.json"
            dest: "{{ playbook_dir }}/../roles/dotfiles/files/dotfiles/macos/apps/cursor/keybindings.json"
            mode: "0644"

        - name: Collect Ghostty config
          copy:
            remote_src: true
            src: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/.config/ghostty/config"
            dest: "{{ playbook_dir }}/../roles/dotfiles/files/dotfiles/macos/apps/ghostty/config"
            mode: "0644"

        - name: Collect Ghostty icons
          copy:
            remote_src: true
            src: "{{ item }}"
            dest: "{{ playbook_dir }}/../roles/dotfiles/files/dotfiles/macos/apps/ghostty/{{ item | basename }}"
            mode: "0644"
          with_fileglob:
            - "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/.config/ghostty/*.icns"
      delegate_to: localhost
      tags: collect

    - name: Snapshot ~/code from {{ source_host }}
      synchronize:
        src: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/code/"
        dest: "{{ ansible_env.HOME }}/code/"
        mode: push
        rsync_opts: "{{ _rsync_common + sync_code_excludes + (['--dry-run'] if _dry_run else []) }}"
        checksum: true
        delete: false
      delegate_to: localhost

    - name: Sync ~/.config/ghostty from {{ source_host }}
      synchronize:
        src: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/.config/ghostty/"
        dest: "{{ ansible_env.HOME }}/.config/ghostty/"
        mode: push
        rsync_opts: "{{ _rsync_common + (['--dry-run'] if _dry_run else []) }}"
        checksum: true
        delete: false
      delegate_to: localhost

    - name: Sync ~/Library/Fonts from {{ source_host }}
      synchronize:
        src: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/Library/Fonts/"
        dest: "{{ ansible_env.HOME }}/Library/Fonts/"
        mode: push
        rsync_opts: "{{ _rsync_common + (['--dry-run'] if _dry_run else []) }}"
        checksum: true
        delete: false
      delegate_to: localhost

    - name: Snapshot ~/.claude/projects from {{ source_host }} (additive)
      synchronize:
        src: "/Users/{{ hostvars[source_host].ansible_user | default('m') }}/.claude/projects/"
        dest: "{{ ansible_env.HOME }}/.claude/projects/"
        mode: push
        rsync_opts: "{{ _rsync_common + (['--dry-run'] if _dry_run else []) }}"
        checksum: true
        delete: false
      delegate_to: localhost
