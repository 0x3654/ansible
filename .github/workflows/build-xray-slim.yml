name: build xray-slim image

"on":
  push:
    branches: [main]
    paths: ["roles/vpnserver/xray-slim/**", "roles/vpnserver/templates/xray/**", ".github/workflows/build-xray-slim.yml"]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/vpnserver-xray

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      core_version: ${{ steps.e2e.outputs.core_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. build locally, no push yet
      - uses: docker/build-push-action@v6
        with:
          context: roles/vpnserver/xray-slim
          platforms: linux/amd64
          load: true
          tags: xray-slim:ci
          build-args: |
            GIT_REV=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. static checks: geodata stripped, size sane
      - name: Test - geodata stripped
        run: |
          if docker run --rm --entrypoint sh xray-slim:ci -c 'ls /usr/local/share/xray/*.dat >/dev/null 2>&1'; then
            echo "FAIL: geodata files still present"; exit 1
          fi
          echo "ok: no .dat files"

      - name: Test - image size under 100MB
        run: |
          SIZE=$(docker image inspect xray-slim:ci --format '{{.Size}}')
          echo "size: $SIZE bytes"
          [ "$SIZE" -lt 100000000 ] || { echo "FAIL: too fat"; exit 1; }

      # 3. full test: render the REAL production config template, boot it,
      #    and drive a real vless+xhttp+reality client through the tunnel
      - name: Test - production config boots and tunnels e2e
        id: e2e
        run: |
          python3 -m pip install --quiet jinja2

          KEYS=$(docker run --rm --entrypoint /usr/local/bin/xray xray-slim:ci x25519)
          # 26.x labels: "PrivateKey: …" / "Password (PublicKey): …" - strip
          # everything up to the first ": " (parens break charset classes)
          export PRIV=$(echo "$KEYS" | sed -n 1p | sed 's/^[^:]*: //')
          export PUB=$(echo "$KEYS" | sed -n 2p | sed 's/^[^:]*: //')

          python - <<'EOF'
          import jinja2, json
          tpl = jinja2.Environment(
              loader=jinja2.FileSystemLoader('roles/vpnserver/templates'),
              undefined=jinja2.StrictUndefined, keep_trailing_newline=True)
          server = tpl.get_template('xray/config.json.j2').render(
              domain_name='api.ipify.org',
              vpnserver_xray_listen_port=18443,
              vpnserver_reality_server_name='api.ipify.org',
              vpnserver_reality_target='api.ipify.org:443',
              vpnserver_entry={'server_info': {'location': 'ci'}},
              vpnserver_x={'client_id': '755a3bfd-d6a8-05b7-8c5f-b0a1cf9121b5',
                           'inbound_port': 18443,
                           'reality_server_name': 'api.ipify.org',
                           'reality_target': 'api.ipify.org:443',
                           'reality_private_key': __import__('os').environ['PRIV'],
                           'reality_public_key': __import__('os').environ['PUB'],
                           'reality_short_ids': ['cd']})
          json.loads(server)
          open('server.json', 'w').write(server)
          client = {
            "log": {"loglevel": "warning"},
            "inbounds": [{"listen": "0.0.0.0", "port": 1080, "protocol": "socks",
                          "settings": {"auth": "noauth", "udp": False}}],
            "outbounds": [{
              "protocol": "vless",
              "settings": {"vnext": [{"address": "xray-srv", "port": 18443,
                "users": [{"id": "755a3bfd-d6a8-05b7-8c5f-b0a1cf9121b5", "encryption": "none"}]}]},
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": {"path": "/", "mode": "auto"},
                "security": "reality",
                "realitySettings": {"serverName": "api.ipify.org", "fingerprint": "chrome",
                                    "publicKey": __import__('os').environ['PUB'],
                                    "shortId": "cd"}}},
            {"protocol": "freedom", "tag": "direct"}]}
          open('client.json', 'w').write(json.dumps(client))
          print('configs rendered from the production template')
          EOF

          docker network create ci-net
          docker run -d --name xray-srv --network ci-net \
            -v "$PWD/server.json":/etc/xray/config.json:ro xray-slim:ci
          docker run -d --name xray-cli --network ci-net \
            -v "$PWD/client.json":/etc/xray/config.json:ro \
            ghcr.io/xtls/xray-core:latest run -c /etc/xray/config.json
          sleep 4
          docker logs xray-srv 2>&1 | grep -q started || { echo "FAIL: server did not start"; docker logs xray-srv; exit 1; }
          docker logs xray-cli 2>&1 | grep -q started || { echo "FAIL: client did not start"; docker logs xray-cli; exit 1; }
          docker run --rm --network ci-net alpine:3.21 nc -z -w 3 xray-srv 18443 || { echo "FAIL: port not listening"; exit 1; }

          for i in 1 2 3; do
            IP=$(docker run --rm --network ci-net curlimages/curl:8.11.1 \
              -sS -m 15 --socks5-hostname xray-cli:1080 https://api.ipify.org 2>/tmp/curl.err) && [ -n "$IP" ] && break
            echo "attempt $i failed: $(cat /tmp/curl.err)"; sleep 3
          done
          [ -n "$IP" ] || {
            echo "FAIL: no egress through the tunnel"
            echo "--- client log:"; docker logs xray-cli 2>&1 | tail -10
            echo "--- server log:"; docker logs xray-srv 2>&1 | tail -10
            echo "--- direct internet sanity:"
            docker run --rm --network ci-net curlimages/curl:8.11.1 -sS -m 10 -o /dev/null -w 'direct api.ipify.org: %{http_code}\n' https://api.ipify.org || true
            exit 1
          }
          echo "ok: e2e tunnel works, egress IP: $IP"

          # core version of the built image - rollback tag + notify text
          VER=$(docker run --rm --entrypoint /usr/local/bin/xray xray-slim:ci version | sed -n 1p | awk '{print $2}')
          echo "CORE_VERSION=$VER" >> "$GITHUB_ENV"
          echo "core_version=$VER" >> "$GITHUB_OUTPUT"
          echo "ok: core version $VER"

          docker rm -f xray-srv xray-cli >/dev/null
          docker network rm ci-net >/dev/null
          rm -f server.json client.json

      # 4. push only after green tests; xray-<version> tag = rollback anchor
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=rev-
            type=raw,value=xray-${{ env.CORE_VERSION }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: roles/vpnserver/xray-slim
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_REV=${{ github.sha }}
          cache-from: type=gha

  # 5. telegram: both outcomes; a RED test means the registry :latest was
  #    NOT moved - the VPS fleet stays behind upstream, protection update
  #    did not land. That is an alert, not a log line.
  notify:
    runs-on: ubuntu-latest
    needs: build-test-push
    if: always()
    steps:
      - name: Telegram notify
        env:
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          RESULT: ${{ needs.build-test-push.result }}
          CORE_VERSION: ${{ needs.build-test-push.outputs.core_version }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "tg secrets not set - skip"; exit 0; }
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$RESULT" = "success" ]; then
            TEXT="✅ vpnserver-xray ${CORE_VERSION}: e2e зелёный, :latest обновлён - watchtower подкатит VPS"
          else
            TEXT="🔴 vpnserver-xray: СБОРКА ПРОВАЛЕНА (${RESULT}) - :latest НЕ обновлён, флот отстал от апстрима (${CORE_VERSION:-версия неизвестна})"
          fi
          MSG="$(printf '%s\n%s' "$TEXT" "$RUN_URL")"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode chat_id="$TG_CHAT" --data-urlencode text="$MSG" >/dev/null && echo "tg notified: $RESULT"
