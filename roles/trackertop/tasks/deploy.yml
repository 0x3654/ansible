---
- name: Deploy tracker-top with health-check
  block:
    - name: Pull latest image
      ansible.builtin.command:
        cmd: "docker pull {{ trackertop_image }}"
      register: trackertop_pull_result
      changed_when: "'Downloaded newer image' in trackertop_pull_result.stdout or 'Pull complete' in trackertop_pull_result.stdout"
      notify: docker up trackertop
      tags: [deploy]

    - name: Bring stack up
      ansible.builtin.command: "{{ common_compose_command | default('docker compose') }} up -d"
      args:
        chdir: "{{ path }}"
      register: trackertop_up_result
      changed_when: >-
        trackertop_up_result.stdout is search('Creating')
        or trackertop_up_result.stdout is search('Recreating')
        or trackertop_up_result.stdout is search('Starting')
        or trackertop_up_result.stderr is search('Creating')
        or trackertop_up_result.stderr is search('Started')
      tags: [deploy]

    - name: Wait for container to be ready
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ trackertop_backend_port }}"
        delay: 5
        timeout: 60
      tags: [deploy]

    - name: Health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ trackertop_backend_port }}/healthz"
        method: GET
        status_code: [200]
      register: trackertop_health_check
      retries: 5
      delay: 5
      until: trackertop_health_check.status == 200
      tags: [deploy]
