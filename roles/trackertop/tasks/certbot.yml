---
- name: Include common certbot tasks
  ansible.builtin.include_role:
    name: common
    tasks_from: certbot.yml
  vars:
    common_up_handler_name: "docker up trackertop"
    common_down_handler_name: "docker down trackertop"
    common_domain_name: "{{ trackertop_domain_name }}"
    common_cert_path: "{{ trackertop_cert_path }}"
    common_telegram_notify_enabled: "{{ telegram_notify_enabled | default(false) }}"
    common_telegram_bot_token: "{{ trackertop_telegram_bot_token | default('') }}"
    common_telegram_chat_id: "{{ trackertop_telegram_chat_id | default('') }}"
    common_telegram_host_name: "{{ inventory_hostname }}"
  tags: [ssl]
