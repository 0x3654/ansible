---
- name: Import file copy tasks
  ansible.builtin.import_tasks: filescopy.yml
  tags: [filescopy]

- name: "Parser mode (mac): deploy + cron only"
  when: jacred_mode == "parser"
  block:
    - name: Import deploy tasks
      ansible.builtin.import_tasks: deploy.yml
      tags: [deploy]

    - name: Import parser cron tasks (macOS)
      ansible.builtin.import_tasks: cron-mac.yml
      tags: [cron]

    - name: Patch run-job.sh for macOS (no flock)
      ansible.builtin.import_tasks: run-job-mac.yml
      tags: [cron]

    - name: Import reverse SSH tunnel tasks (moro -> ae2)
      ansible.builtin.import_tasks: tunnel.yml
      tags: [tunnel]

- name: "Server mode (VPS): cert, nginx, deploy, host cron"
  when: jacred_mode == "server"
  block:
    - name: Import certbot tasks
      ansible.builtin.import_tasks: certbot.yml
      tags: [certbot]

    - name: Import nginx tasks
      ansible.builtin.import_tasks: nginx.yml
      tags: [nginx]

    - name: Import deploy tasks
      ansible.builtin.import_tasks: deploy.yml
      tags: [deploy]

    - name: Import cron tasks
      ansible.builtin.import_tasks: cron.yml
      tags: [cron]
