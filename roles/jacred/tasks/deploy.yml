---
- name: Deploy jacred with health-check
  block:
    - name: Bring stack up
      ansible.builtin.command: "{{ common_compose_command | default('docker compose') }} up -d"
      args:
        chdir: "{{ path }}"
      register: jacred_up_result
      changed_when: >-
        jacred_up_result.stdout is search('Creating')
        or jacred_up_result.stdout is search('Recreating')
        or jacred_up_result.stdout is search('Starting')
        or jacred_up_result.stderr is search('Creating')
        or jacred_up_result.stderr is search('Started')
      tags: [deploy]

    - name: Wait for container to be ready
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ jacred_backend_port }}"
        delay: 10
        timeout: 120
      tags: [deploy]

    - name: Health check (api v1 conf, apikey)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ jacred_backend_port }}/api/v1.0/conf?apikey={{ jacred_api_key }}"
        method: GET
        status_code: [200]
      register: jacred_health_check
      retries: 5
      delay: 5
      until: jacred_health_check.status == 200
      no_log: true
      tags: [deploy]
