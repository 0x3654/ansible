---
- name: Ensure base directory exists
  ansible.builtin.file:
    path: "{{ path }}"
    state: directory
    mode: "0755"
  tags: [filescopy]

- name: Ensure data and config directories exist
  ansible.builtin.file:
    path: "{{ path }}/{{ item }}"
    state: directory
    mode: "0755"
    # контейнер non-root: UID/GID 1000 (jacred) должен владеть Data и config
    owner: "1000"
    group: "1000"
  loop:
    - data
    - config
  tags: [filescopy]

- name: Copy compose file from role files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/jacred/files/jacred/compose.yaml"
    dest: "{{ path }}/docker-compose.yaml"
    mode: "0644"
  tags: [filescopy]

# конфиг — templated init.yaml: ключи из vars/secrets.yml, не логируем
- name: Write init.yaml
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/jacred/templates/init.yaml.j2"
    dest: "{{ path }}/config/init.yaml"
    # контейнер бежит non-root (UID 1000) — 0600/root он прочитать не может
    mode: "0644"
  no_log: true
  notify: docker up jacred
  tags: [filescopy]
