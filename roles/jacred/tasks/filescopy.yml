---
- name: Ensure base directory exists
  ansible.builtin.file:
    path: "{{ path }}"
    state: directory
    mode: "0755"
  tags: [filescopy]

- name: Ensure data and config directories exist
  ansible.builtin.file:
    path: "{{ path }}/{{ item }}"
    state: directory
    mode: "0755"
    # контейнер non-root: UID/GID 1000 (jacred) должен владеть Data и config
    owner: "{{ '1000' if ansible_system == 'Linux' else omit }}"
    group: "{{ '1000' if ansible_system == 'Linux' else omit }}"
  loop:
    - data
    - config
  tags: [filescopy]

- name: Copy compose file from role files (server)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/jacred/files/jacred/compose.yaml"
    dest: "{{ path }}/docker-compose.yaml"
    mode: "0644"
  when: jacred_mode == "server"
  tags: [filescopy]

- name: Copy compose file from role files (parser)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/jacred/files/jacred/compose-parser.yaml"
    dest: "{{ path }}/docker-compose.yaml"
    mode: "0644"
  when: jacred_mode == "parser"
  tags: [filescopy]

# конфиг — templated init.yaml: ключи из vars/secrets.yml, не логируем
- name: Write init.yaml (server)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/jacred/templates/init.yaml.j2"
    dest: "{{ path }}/config/init.yaml"
    mode: "0644"
  no_log: true
  notify: docker up jacred
  when: jacred_mode == "server"
  tags: [filescopy]

- name: Write init.yaml (parser)
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/jacred/templates/init-parser.yaml.j2"
    dest: "{{ path }}/config/init.yaml"
    mode: "0644"
  no_log: true
  notify: docker up jacred
  when: jacred_mode == "parser"
  tags: [filescopy]

# run-job.sh не копируется в биндаут Data сам (дефолты раскладываются только
# в пустой Data) — кладём из апстрима, крона без него тихо умирает
- name: Fetch run-job.sh from upstream
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/jacred-fdb/jacred/main/Data/run-job.sh
    dest: "{{ path }}/data/run-job.sh"
    mode: "0755"
  tags: [filescopy]
