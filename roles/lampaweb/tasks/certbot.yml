---
- name: Include common certbot tasks
  ansible.builtin.include_role:
    name: common
    tasks_from: certbot.yml
  vars:
    common_up_handler_name: "start nginx"
    common_down_handler_name: "stop nginx"
    common_domain_name: "{{ lampaweb_domain_name }}"
    common_cert_path: "{{ lampaweb_cert_path }}"
    common_telegram_notify_enabled: "{{ telegram_notify_enabled | default(false) }}"
    common_telegram_bot_token: "{{ lampaweb_telegram_bot_token | default('') }}"
    common_telegram_chat_id: "{{ lampaweb_telegram_chat_id | default('') }}"
    common_telegram_host_name: "{{ inventory_hostname }}"
  tags: [ssl]
