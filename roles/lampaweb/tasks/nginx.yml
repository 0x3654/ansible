---
# Статический сайт клона (общий nginx-шаблон — прокси, здесь своя конфигурация)

- name: Configure nginx site for lampaweb
  ansible.builtin.template:
    src: lampaweb.conf.j2
    dest: /etc/nginx/sites-available/lampaweb
    mode: "0644"
    owner: root
    group: root
  notify: reload nginx
  tags: [nginx]

- name: Enable nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lampaweb
    dest: /etc/nginx/sites-enabled/lampaweb
    state: link
  notify: reload nginx
  tags: [nginx]

- name: Test nginx configuration
  ansible.builtin.command: nginx -t
  register: lampaweb_nginx_test
  changed_when: false
  tags: [nginx]

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  tags: [nginx]
