---
# Вебрут клона: официальный бандл + наши плагины + lampainit с bootstrap.
# git с force:true отбрасывает локальные правки index.html — поэтому патч
# index.html и lampainit применяются ПОСЛЕ git на каждом прогоне.

- name: Ensure base directory exists
  ansible.builtin.file:
    path: "{{ path }}"
    state: directory
    mode: "0755"
  tags: [webroot]

- name: Clone/update official Lampa bundle
  ansible.builtin.git:
    repo: "{{ lampaweb_upstream }}"
    dest: "{{ path }}/webroot"
    version: main
    update: true
    force: true
  tags: [webroot]

- name: Put bootstrap t.js into webroot (user-site)
  ansible.builtin.get_url:
    url: "{{ lampaweb_tjs_url }}"
    dest: "{{ path }}/webroot/t.js"
    mode: "0644"
    force: true # Pages CDN + If-Modified-Since ловят вечный 304
  tags: [webroot]

- name: Put our plugins into webroot (GitHub Pages)
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ path }}/webroot/{{ item.split('/')[-1] }}"
    mode: "0644"
    force: true
  loop: "{{ lampaweb_plugins }}"
  tags: [webroot]

# Локальный анлок куб-статусов (Смотрю/Просмотрено/…): hasPremium в бандле
# читает премиум-флаг аккаунта с сервера cub — сервер может его увести в
# любой момент (так и случилось 25.10), замки возвращаются. Патчим бандл:
# безусловно: куб-аккаунт и его премиум не нужны, статусы синкаются plex-sync в marks.
# Идемпотентно: применённый патч не меняет строку-образец
- name: Unlock cub statuses in app bundle (hasPremium)
  ansible.builtin.replace:
    path: "{{ path }}/webroot/app.min.js"
    replace: "return 1;"
    regexp: 'return user\.id \? Utils\$1\.countDays\(Date\.now\(\), user\.premium\) : 0;'
  tags: [webroot]

# Сезонные промо куба (halloween/black-friday/snow/new-year/womens-day):
# ServiceEvents грузит с их зеркал /plugin/<событие> — рисует мигающую
# кнопку-рекламу в шапке. Выключаем загрузчик целиком: init сразу выходит
# имя функции сохраняем capture-группой: минификатор даёт init$N, а ссылка
# ServiceEvents.init = init$N остаётся — переименование вешает бут на лого
- name: Disable cub seasonal promo events in app bundle
  ansible.builtin.replace:
    path: "{{ path }}/webroot/app.min.js"
    regexp: '(function init\$\d+\(\) \{\s*)if \(!window\.lampa_settings\.services\) return;'
    replace: '\1return;'
  tags: [webroot]

- name: Render lampainit.js (official hook, waits for Lampa and loads t.js)
  ansible.builtin.template:
    src: lampainit.js.j2
    dest: "{{ path }}/webroot/lampainit.js"
    mode: "0644"
  tags: [webroot]

# Прямое открытие клона: lampainit подключается к index.html;
# в режиме «подмены адреса» (lampa_url) оболочка грузит lampainit.js сама
- name: Embed lampainit into index.html
  ansible.builtin.lineinfile:
    path: "{{ path }}/webroot/index.html"
    line: '    <script src="./lampainit.js"></script>'
    insertbefore: "</head>"
  tags: [webroot]
