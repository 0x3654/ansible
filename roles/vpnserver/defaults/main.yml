---
# defaults file for vpnserver

# Required system packages
required_packages:  # noqa: var-naming[no-role-prefix]
  - docker-ce
  - docker-compose-plugin
  - curl
  - bash
  - openssl
  - vim
  - sqlite3
  - certbot
  - python3-setuptools
  - fail2ban
  - whois

# Docker repository installation control
install_docker_repo: true  # noqa: var-naming[no-role-prefix]
update_repo: true  # noqa: var-naming[no-role-prefix]
force_repo_update: true  # noqa: var-naming[no-role-prefix]

# User and paths
folder_user: "{{ ansible_role_name | basename }}"  # noqa: var-naming[no-role-prefix]
pwd: "/server"  # noqa: var-naming[no-role-prefix]
path: "{{ pwd }}/vpnserver"  # noqa: var-naming[no-role-prefix]
vpnserver_xray_path: "{{ path }}/3x-ui"
vpnserver_xray_db_path: "{{ vpnserver_xray_path }}/db"

# Эталонный каталог на moro для transient-фрагментов (генерация нового сервера);
# постоянное хранение конфигов 3x-ui — vault-словарь three_ui_servers
# в group_vars/vps/secrets.yml
vpnserver_configs_dir: /Users/m/code/ansible/configs
vpnserver_cert_path: "{{ pwd }}/certbot"
vpnserver_amneziawg_path: "{{ path }}/amneziawg"
vpnserver_fail2ban_path: "{{ path }}/fail2ban"
vpnserver_mtproxy_path: "{{ path }}/mtproxy"
vpnserver_mtproxy_port: "445"
vpnserver_mtproxy_enabled: true
vpnserver_amneziawg_enabled: true

# File permissions
directory_mode: "0755"  # noqa: var-naming[no-role-prefix]
file_mode: "0600"  # noqa: var-naming[no-role-prefix]

# Reality SNI policy (2026-11-22): clients send the server's OWN domain
# (DNS-consistent with its IP - the TSPU check that flags foreign-SNI
# masquerades). The fallback target points at the local gateway page
# (basic-auth camouflage) when the gateway is enabled.
vpnserver_reality_server_name: "{{ domain_name }}"
vpnserver_reality_target: "127.0.0.1:443"

# Gateway camouflage (basic-auth page on the VPN SNI domain); auto-skipped
# on door hosts where nginx 443 is the SNI door instead.
vpnserver_gateway_enabled: true

# SNI-door on port 443: share 443 with a busy nginx via stream/ssl_preread.
# Door SNI (== vpnserver_reality_server_name) routes to the xray inbound,
# everything else goes to the local vhosts listening on the internal port.
vpnserver_nginx_door_enabled: false
vpnserver_nginx_door_xray_port: 8443
vpnserver_nginx_door_internal_port: 1443
