---
# defaults file for vpnserver

# Required system packages
required_packages:  # noqa: var-naming[no-role-prefix]
  - docker-ce
  - docker-compose-plugin
  - curl
  - bash
  - openssl
  - vim
  - certbot
  - python3-setuptools
  - fail2ban
  - whois

# Docker repository installation control
install_docker_repo: true  # noqa: var-naming[no-role-prefix]
update_repo: true  # noqa: var-naming[no-role-prefix]
force_repo_update: true  # noqa: var-naming[no-role-prefix]

# User and paths
folder_user: "{{ ansible_role_name | basename }}"  # noqa: var-naming[no-role-prefix]
pwd: "/server"  # noqa: var-naming[no-role-prefix]
path: "{{ pwd }}/vpnserver"  # noqa: var-naming[no-role-prefix]
vpnserver_xray_path: "{{ path }}/3x-ui"
vpnserver_xray_db_path: "{{ vpnserver_xray_path }}/db"

# Эталонный каталог на moro для transient-фрагментов (генерация нового сервера);
# постоянное хранение конфигов 3x-ui — vault-словарь three_ui_servers
# в group_vars/vps/secrets.yml
vpnserver_configs_dir: /Users/m/code/ansible/configs
vpnserver_cert_path: "{{ pwd }}/certbot"
vpnserver_fail2ban_path: "{{ path }}/fail2ban"

# Backend: 'panel' (legacy 3x-ui, rollback path until the fleet is cut
# over) or 'xray' (pure kernel + static sub, config from the vault dict)
vpnserver_backend: "panel"

# Pure xray backend: the kernel always listens on 8443 (door hosts route
# 443 -> 8443 by SNI, gateway hosts serve the camouflage page on 443 and
# clients hit the xray port directly). Client-facing port differs: 443
# behind the door, 8443 direct.
vpnserver_xray_listen_port: "8443"
vpnserver_xray_default_client_port: "{{ 443 if vpnserver_nginx_door_enabled | default(false) | bool else 8443 }}"
# xray image: our own registry, :latest straight out of the box.
# Quality gate = CI (full e2e test with the production config template
# before every push); watchtower rolls hosts to fresh :latest on its own -
# update speed beats downtime purism. Manual rollback = pin this var to a
# rev-<sha> / xray-<version> tag for one deploy.
# Requires the first CI publication of ghcr.io/0x3654/vpnserver-xray:
vpnserver_xray_image: "ghcr.io/0x3654/vpnserver-xray:latest"
# pre-publication fallback (official, digest-pinned):
# vpnserver_xray_image: "ghcr.io/xtls/xray-core:26.11.9@sha256:d42420dca2014cbd06e24daad8a039b455b7d9e905cda1cf871254cfffda2149"
vpnserver_sub_webroot: "/var/www/vpnserver-sub"

# Subscription headers - panel parity by default: the brand title the
# panel served (subTitle) and the hourly refresh window (subUpdates=1);
# RF clients must pick up re-issued links fast during blocking events
vpnserver_sub_title: "0x3654.com"
vpnserver_sub_update_interval: 1

# File permissions
directory_mode: "0755"  # noqa: var-naming[no-role-prefix]
file_mode: "0600"  # noqa: var-naming[no-role-prefix]

# Reality SNI policy (2026-11-22): clients send the server's OWN domain
# (DNS-consistent with its IP - the TSPU check that flags foreign-SNI
# masquerades). The fallback target points at the local gateway page
# (basic-auth camouflage) when the gateway is enabled.
vpnserver_reality_server_name: "{{ domain_name }}"
vpnserver_reality_target: "127.0.0.1:443"

# Gateway camouflage (basic-auth page on the VPN SNI domain); auto-skipped
# on door hosts where nginx 443 is the SNI door instead.
vpnserver_gateway_enabled: true

# Separate switch for the gateway VHOST only. On hosts where another role
# owns the 443 vhost on the same server_name (ru2: torrserver, ae2: vdl),
# the camouflage is merged into that vhost instead: assets (page, htpasswd),
# the host-wide fingerprint drop-in and the Reality fallback sync stay with
# this role, but deploying the standalone vhost would create a duplicate
# server_name that shadows the real site (sites-enabled load order).
vpnserver_gateway_vhost_enabled: true

# SNI-door on port 443: share 443 with a busy nginx via stream/ssl_preread.
# Door SNI (== vpnserver_reality_server_name) routes to the xray inbound,
# everything else goes to the local vhosts listening on the internal port.
vpnserver_nginx_door_enabled: false
vpnserver_nginx_door_xray_port: 8443
vpnserver_nginx_door_internal_port: 1443
