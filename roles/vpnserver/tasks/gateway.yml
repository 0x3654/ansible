---
# Gateway camouflage: a basic-auth protected static page on the VPN SNI
# domain (443). Browsers see an ordinary "closed resource" (401), the
# Reality fallback relays unauthenticated TLS here, clients use the xray
# port directly and never touch nginx. Skipped on door hosts (es): the
# door owns 443 and routes SNI to xray/1443 instead.
- name: Gateway camouflage
  when:
    - vpnserver_gateway_enabled | default(true)
    - not (vpnserver_nginx_door_enabled | default(false))
  tags: [gateway]
  block:
    - name: Install nginx and htpasswd utils
      ansible.builtin.apt:
        name:
          - nginx
          - apache2-utils
          - libnginx-mod-http-headers-more-filter
        state: present
        update_cache: true

    - name: Create gateway directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /var/www/gateway
        - /etc/nginx/htpasswd

    - name: Hide server fingerprint host-wide
      # http-level drop-in: covers every vhost on the host (gateway and
      # foreign apps alike) - no version, no OS, no Server header at all
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/00-hide-server.conf
        mode: "0644"
        content: |
          server_tokens off;
          more_clear_headers Server;
      notify: Reload nginx

    - name: Deploy gateway page
      ansible.builtin.copy:
        dest: /var/www/gateway/index.html
        mode: "0644"
        content: |
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Service Gateway</title><style>body{font-family:system-ui,sans-serif;background:#f5f6f7;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:2rem 3rem;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}h1{font-size:1.2rem;color:#333}p{color:#777;font-size:.9rem}</style></head><body><div class="card"><h1>Service Gateway</h1><p>Authenticated access only. Contact your administrator for credentials.</p></div></body></html>

    - name: Generate gateway credentials once
      # random user/pass, forgotten on purpose: the page only needs to look
      # closed, nobody is supposed to log in
      ansible.builtin.shell: |
        set -o pipefail
        [ -s /etc/nginx/htpasswd/gateway ] && exit 0
        htpasswd -bc /etc/nginx/htpasswd/gateway "$(openssl rand -hex 4)" "$(openssl rand -hex 12)"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Deploy gateway vhost
      ansible.builtin.template:
        src: gateway-vhost.conf.j2
        dest: /etc/nginx/sites-available/gateway
        mode: "0644"
      when: vpnserver_gateway_vhost_enabled | default(true)
      notify: Reload nginx

    - name: Enable gateway vhost
      ansible.builtin.file:
        src: /etc/nginx/sites-available/gateway
        dest: /etc/nginx/sites-enabled/gateway
        state: link
      when: vpnserver_gateway_vhost_enabled | default(true)
      notify: Reload nginx

    - name: Remove gateway vhost when the site role owns 443
      # ru2 (torrserver) / ae2 (vdl): camouflage lives inside the site-owning
      # role's vhost; a separate gateway vhost on the same server_name wins
      # by sites-enabled load order and shadows the real site
      when: not (vpnserver_gateway_vhost_enabled | default(true))
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/gateway
        - /etc/nginx/sites-available/gateway
      notify: Reload nginx

    - name: Ensure nginx is running
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

