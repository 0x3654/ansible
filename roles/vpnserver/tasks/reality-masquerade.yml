---
# Keep the Reality masquerade of inbound id=1 in sync with role vars.
# TSPU burns masquerades and IPs over time; changing the SNI/dest must be a
# one-variable redeploy, not manual sqlite surgery (2026-10-16 incident).
- name: Reality masquerade sync
  tags: [reality]
  block:
    - name: Read current stream_settings
      ansible.builtin.shell: |
        set -o pipefail
        sqlite3 "{{ vpnserver_xray_db_path }}/x-ui.db" \
          "select stream_settings from inbounds where id=1;"
      args:
        executable: /bin/bash
      register: vpnserver_stream_raw
      changed_when: false

    - name: Ensure masquerade matches vpnserver_reality_target
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PYEOF' "{{ vpnserver_stream_raw.stdout }}" "{{ vpnserver_reality_target }}" "{{ vpnserver_reality_server_name }}" /tmp/vpnserver_stream_new.json
        import json, sys
        stream = json.loads(sys.argv[1])
        target, server_name, out_path = sys.argv[2], sys.argv[3], sys.argv[4]
        reality = stream.get("realitySettings", {})
        current = (reality.get("target"), reality.get("serverNames"))
        desired = (target, [server_name])
        if current == desired:
            sys.exit(10)  # no change needed
        reality["target"] = target
        reality["serverNames"] = [server_name]
        reality.setdefault("settings", {})["serverName"] = ""
        with open(out_path, "w") as f:
            json.dump(stream, f, separators=(",", ":"), ensure_ascii=False)
        PYEOF
      args:
        executable: /bin/bash
      register: vpnserver_masquerade_patch
      changed_when: vpnserver_masquerade_patch.rc == 0
      failed_when: vpnserver_masquerade_patch.rc not in [0, 10]

    - name: Apply new stream_settings to database
      when: vpnserver_masquerade_patch.rc == 0
      ansible.builtin.shell: |
        set -euo pipefail
        sqlite3 "{{ vpnserver_xray_db_path }}/x-ui.db" \
          "UPDATE inbounds SET stream_settings = readfile('/tmp/vpnserver_stream_new.json') WHERE id=1;"
        rm -f /tmp/vpnserver_stream_new.json
      args:
        executable: /bin/bash
      notify: Restart docker 3x-ui by shell
