---
- name: Import APT management tasks
  ansible.builtin.import_tasks: apt.yml
  tags: [apt, upgrade]

- name: Import certbot tasks
  ansible.builtin.import_tasks: certbot.yml
  tags: [certbot]

# xray converge runs BEFORE filescopy: filescopy flushes its compose-up
# handler right after the rsync, so configs must already exist on a
# first deploy (fresh hosts have nothing to compose up from otherwise)
- name: Import xray tasks
  ansible.builtin.import_tasks: xray.yml
  tags: [xray]

- name: Import file copy tasks
  ansible.builtin.import_tasks: filescopy.yml
  tags: [filescopy]

- name: Import fail2ban tasks
  ansible.builtin.import_tasks: fail2ban.yml
  tags: [fail2ban]

- name: Import nginx SNI-door tasks
  ansible.builtin.import_tasks: nginx-door.yml
  tags: [door]

- name: Import gateway camouflage tasks
  ansible.builtin.import_tasks: gateway.yml
  tags: [gateway]

- name: Import firewall tasks
  ansible.builtin.import_tasks: firewall.yml
  tags: [firewall]
