- name: 3x-ui Extract values from config
  block:
    # Серверные конфиги живут в vault-словаре group_vars/vps/secrets.yml
    - name: Extract values from vault config
      when: domain_name in (three_ui_servers | default({}))
      ansible.builtin.set_fact:
        vpnserver_config_yaml: "{{ three_ui_servers[domain_name] }}"
        vpnserver_web_port: "{{ (three_ui_servers[domain_name].panel.url | regex_search('https://.*:(\\d+)/', '\\1') | first) if three_ui_servers[domain_name].panel is defined else omit }}"
        vpnserver_sub_port: "{{ (three_ui_servers[domain_name].subscription.suburl | regex_search('https://.*:(\\d+)/', '\\1') | first) if three_ui_servers[domain_name].subscription is defined else omit }}"
      no_log: true

    - name: Set firewall rules
      ansible.builtin.set_fact:
        vpnserver_firewall_rules:
          - "-A INPUT -p tcp -m tcp --dport {{ ssh_port | default(22) }} -j ACCEPT"
          - "-A INPUT -p tcp -m tcp --dport {{ https_port | default(443) }} -j ACCEPT"
          - "-A INPUT -p tcp -m tcp --dport {{ vpnserver_sub_port | default(31000) }} -j ACCEPT"

    - name: Add MTProxy port when enabled
      when: vpnserver_mtproxy_enabled
      ansible.builtin.set_fact:
        vpnserver_firewall_rules: >-
          {{ vpnserver_firewall_rules
          + ['-A INPUT -p tcp -m tcp --dport ' + vpnserver_mtproxy_port + ' -j ACCEPT'] }}

    - name: Add AmneziaWG port when enabled and non-ARM64
      ansible.builtin.set_fact:
        vpnserver_firewall_rules: >-
          {{ vpnserver_firewall_rules
          + ['-A INPUT -p udp -m udp --dport '
          + vpnserver_amneziawg_wg_port | default(51820) | string
          + ' -j ACCEPT'] }}
      when: ansible_facts['architecture'] != 'aarch64' and vpnserver_amneziawg_enabled | default(true)

    - name: Call firewall role with dynamic rules
      ansible.builtin.include_role:
        name: common
        tasks_from: firewall.yml
      vars:
        common_required_rules: "{{ vpnserver_firewall_rules }}"
      tags: [firewall]
