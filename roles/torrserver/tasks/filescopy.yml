---
- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ path }}"
    - "{{ path }}/config"
    - "{{ path }}/torrents"
  tags: [filescopy]

- name: Copy docker compose file from role files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/torrserver/files/torrserver/compose.yaml"
    dest: "{{ path }}/docker-compose.yaml"
    mode: "0644"
  notify: docker up torrserver
  tags: [filescopy]

- name: Render TorrServer settings
  ansible.builtin.template:
    src: settings.json.j2
    dest: "{{ path }}/config/settings.json"
    mode: "0644"
  tags: [filescopy]
