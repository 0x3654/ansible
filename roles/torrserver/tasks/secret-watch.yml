---
# Детект утечки секретного пути: скрипт + env с TG-ботом + часовой крон
- name: Copy secret-watch script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../roles/torrserver/files/torrserver/secret-watch.sh"
    dest: "{{ path }}/secret-watch.sh"
    mode: "0755"
  tags: [secret-watch]

- name: Render secret-watch environment (TG bot + secret)
  ansible.builtin.template:
    src: secret-watch.env.j2
    dest: "{{ path }}/secret-watch.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  tags: [secret-watch]

- name: Install hourly cron job
  ansible.builtin.template:
    src: torrserver-secret-watch.cron.j2
    dest: /etc/cron.d/torrserver-secret-watch
    mode: "0644"
  tags: [secret-watch]

# Релей TG-алертов через ae2: api.telegram.org с сети ru2 недоступен (DNS)
- name: Generate relay keypair on ru2
  ansible.builtin.command:
    cmd: "ssh-keygen -q -t ed25519 -N '' -C torrserver-tg-relay -f /root/.ssh/torrserver_tg_relay"
    creates: /root/.ssh/torrserver_tg_relay
  tags: [secret-watch]

- name: Trust ae2 host key on ru2
  ansible.builtin.command:
    cmd: "ssh-keyscan -H -t ed25519 {{ torrserver_tg_relay_host }} >> /root/.ssh/known_hosts"
  register: torrserver_keyscan
  changed_when: "'found' in torrserver_keyscan.stderr"
  tags: [secret-watch]

- name: Read ru2 relay public key
  ansible.builtin.command:
    cmd: "cat /root/.ssh/torrserver_tg_relay.pub"
  register: torrserver_relay_pub
  changed_when: false
  tags: [secret-watch]

- name: Install relay key on ae2
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ torrserver_relay_pub.stdout }}"
    state: present
    create: true
    mode: "0600"
  delegate_to: "{{ torrserver_tg_relay_host }}"
  tags: [secret-watch]
