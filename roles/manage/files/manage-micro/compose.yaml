# micro-specific manage stack (deployed to /git/docker/manage via host_vars overrides)
# Source of truth synced from host 2026-09-06. Secrets templated from vars/secrets.yml
# and host_vars/micro.yml (manage_micro_beszel_token).
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 8090:8090
    volumes:
      - beszel:/beszel_data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      # external URL used in notification links (was http://localhost:8090)
      APP_URL: https://micro-beszel.koi-uaru.ts.net
    labels:
      tsdproxy.enable: "true"
      # RFC 1123: underscores are invalid, tsdproxy rejected "micro_beszel"
      tsdproxy.name: micro-beszel
      tsdproxy.container_port: 8090
      com.centurylinklabs.watchtower.enable: "true"
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45877
      KEY: '{{manage_beszel_public_key}}'
      TOKEN: '{{manage_micro_beszel_token}}'
      HUB_URL: http://10.0.1.51:8090
      PORT: 45876
      MEM_CALC: htop
      # Delete next line if you want see all sensors
      SENSORS: coretemp_package_id_0
      KEY_FILE: ../_secrets/beszel_agent_key
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "45876"]
      interval: 30s
      timeout: 10s
      retries: 3
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer:/data
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: micro_portainer
      tsdproxy.container_port: 9443
      tsdproxy.scheme: "https"
      tsdproxy.tlsvalidate: "false"
    ports:
      - "9443:9443"
      - "9000:9000"
      - "8000:8000"
    restart: unless-stopped

  portainer_agent:
    image: portainer/agent:2.33.6
    container_name: portainer_agent
    restart: unless-stopped
    network_mode: host
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    environment:
      - AGENT_CLUSTER_ADDR=tasks.portainer_agent


  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    hostname: "micro"
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 0,8,16 * * *
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=telegram://{{manage_watchtower_tg_wt_bot_token}}@telegram/?channels={{manage_watchtower_tg_wt_chat_id}}
      - WATCHTOWER_ENABLE_LIFECYCLE_HOOKS=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_HEALTHCHECK=true
      - WATCHTOWER_NOTIFICATION_TITLE_TAG=micro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  statping:
    image: dockurr/statping:latest
    container_name: statping
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - statping:/app
    ports:
      - "8888:8080"
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: statping
      tsdproxy.container_port: 8888
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  diun:
    container_name: diun
    image: crazymax/diun:latest
    command: serve
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "../_data/diun:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - "DIUN_WATCH_WORKERS=20"
      - "DIUN_WATCH_SCHEDULE=0 */6 * * *"
      - "DIUN_WATCH_JITTER=30s"
      - "DIUN_PROVIDERS_DOCKER=true"
    labels:
      - "diun.enable=true"
    restart: always
    healthcheck:
      test: ["CMD", "pidof", "diun"]
      interval: 30s
      timeout: 10s
      retries: 3

  healthchecks:
    image: healthchecks/healthchecks:latest
    container_name: healthchecks
    environment:
      - DB=sqlite
      - DB_NAME=/data/hc.sqlite
      - DEBUG=False
      - DEFAULT_FROM_EMAIL=fixme-email-address-here
      - EMAIL_HOST=fixme-smtp-host-here
      - EMAIL_HOST_PASSWORD=fixme-smtp-password-here
      - EMAIL_HOST_USER=fixme-smtp-username-here
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - SECRET_KEY=---
      - SITE_ROOT=http://localhost:8000
    ports:
      - 8000:8000
    volumes:
      - healthchecks:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  casa:
    image: dockurr/casa
    container_name: casa
    ports:
      - 8088:8080
    volumes:
      - casa:/DATA
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: always
    stop_grace_period: 1m

  telegram-notifier:
    image: lorcas/docker-telegram-notifier:latest
    container_name: telegram-notifier
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro # for local instance
    environment:
     - TELEGRAM_NOTIFIER_BOT_TOKEN={{manage_watchtower_tg_wt_bot_token}}
     - TELEGRAM_NOTIFIER_CHAT_ID={{manage_watchtower_tg_wt_chat_id}}

  checkcle:
    image: operacle/checkcle:latest
    container_name: checkcle
    restart: unless-stopped
    ports:
      - "8099:8090"  # Web Application
    volumes:
      - ./data_checkcle:/mnt/pb_data  # Host directory mapped to container path
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

volumes:
  beszel:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../_data/beszel
  portainer:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../_data/portainer
  statping:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../_data/statping
  healthchecks:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../_data/healthchecks
  casa:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../_data/casa

secrets:
  beszel_agent_key:
    file: ../_secrets/beszel_agent_key
