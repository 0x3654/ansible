---
# Universal mediaserver role (micro + nano). Host differences come from the
# mediaserver_role group/host vars in the inventory - see README.md for the
# per-host checklist. micro: nvidia gpu, tsdproxy labels, ru2 frp tunnel, LAN DNS.
# nano: everything off by default; images are multi-arch, no GPU -> software transcode.

# Stack directory. Compose PROJECT NAME (= volume prefix mediaserver_plex/…)
# derives from it - never rename on a live host or the volumes orphan.
mediaserver_path: "/git/docker/mediaserver"
mediaserver_data_root: "../_data"       # relative to the compose dir; bind-backed named volumes
mediaserver_secrets_dir: "../_secrets"  # per-host secret files (plex.env, media-binds.yaml) live on the host
mediaserver_media_binds_extends: false  # true: extend plex with <secrets>/media-binds.yaml (x-media-binds)
mediaserver_transcode_size: "2G"        # plex /transcode tmpfs size

# Feature flags (override per host in inventory)
mediaserver_gpu: false                  # nvidia passthrough (needs nvidia-container-toolkit on the host)
mediaserver_tsdproxy: false             # tsdproxy labels on plex/tautulli
mediaserver_plex_tsdproxy_name: "plex"
mediaserver_dns: []                     # custom resolver list for plex (empty = omit the block)
mediaserver_frp_tunnel: false           # frpc + tunnel-watch + frpc-guard services + tunnel network

# frp tunnel internals (only used when mediaserver_frp_tunnel is true)
mediaserver_frpc_container: "frpc"
mediaserver_frp_server_addr: "109.196.164.162"
mediaserver_frp_server_port: 7000
# per-host frps tokens live in vars/secrets.yml: mediaserver_frp_tokens[inventory_hostname]

# Library management at deploy time: ensure sections with exact location lists
# (empty locations are fine - plex shows nothing until a disk is plugged in).
# Entry: {name, type: movie|show, agent, scanner, language, locations: [...]}
mediaserver_manage_libraries: false
mediaserver_libraries: []
