---
# frpc.toml is a bind-mounted single file: a copy replaces the inode and the
# running container keeps the old one until it is restarted
- name: Restart frpc container
  ansible.builtin.command: docker restart {{ mediaserver_frpc_container }}
  register: mediaserver_frpc_restart_result
  changed_when: true

- name: Recreate mediaserver stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ mediaserver_path }}"
  register: mediaserver_compose_up_result
  changed_when: >-
    mediaserver_compose_up_result.stdout is search('Creating')
    or mediaserver_compose_up_result.stdout is search('Recreating')
    or mediaserver_compose_up_result.stdout is search('Starting')
