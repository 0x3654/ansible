---
- name: Build the list of required host secret files
  ansible.builtin.set_fact:
    mediaserver_required_secrets: >-
      {{ ['plex.env']
         + (['media-binds.yaml'] if mediaserver_media_binds_extends else [])
         + (['frp-watch.env'] if mediaserver_frp_tunnel else []) }}

- name: Verify required host secret files exist
  ansible.builtin.stat:
    path: "{{ mediaserver_path }}/{{ mediaserver_secrets_dir }}/{{ item }}"
  loop: "{{ mediaserver_required_secrets }}"
  register: mediaserver_secret_stats

- name: Fail with guidance when a required secret file is missing
  ansible.builtin.assert:
    that: mediaserver_secret_stats.results | selectattr('stat.exists') | list | length == mediaserver_required_secrets | length
    fail_msg: >-
      Missing secret file(s) on {{ inventory_hostname }}:
      {{ mediaserver_required_secrets | difference(mediaserver_secret_stats.results | selectattr('stat.exists') | map(attribute='item') | list) }}.
      Create them under {{ mediaserver_path }}/{{ mediaserver_secrets_dir }}/ on the host
      (see roles/mediaserver/README.md) - secret files live on hosts, not in git.
    quiet: true

- name: Ensure mediaserver stack directory exists
  ansible.builtin.file:
    path: "{{ mediaserver_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure frpc config directory exists
  when: mediaserver_frp_tunnel
  ansible.builtin.file:
    path: "{{ mediaserver_path }}/frpc"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render mediaserver stack compose
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ mediaserver_path }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate mediaserver stack

- name: Deploy frpc tunnel config
  when: mediaserver_frp_tunnel
  ansible.builtin.template:
    src: frpc.toml.j2
    dest: "{{ mediaserver_path }}/frpc/frpc.toml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart frpc container
  no_log: true
