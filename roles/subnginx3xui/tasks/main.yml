---
- name: Import APT management tasks
  ansible.builtin.import_tasks: apt.yml
  tags: [apt, upgrade]

- name: Configure sub-nginx for 3x-ui
  tags: [sub_nginx_3xui]
  block:
    - name: Import certbot tasks
      ansible.builtin.import_tasks: certbot.yml

    - name: Set vpn_servers_sub variable
      # Апстримы берутся из vault-словаря three_ui_servers
      # (group_vars/vps/secrets.yml): base_url = suburl без последнего сегмента
      no_log: true
      ansible.builtin.set_fact:
        subnginx3xui_vpn_servers_sub: >-
          {%- set suburls = [] -%}
          {%- for dom, cfg in (three_ui_servers | default({})).items() -%}
            {%- if cfg.subscription is defined and cfg.subscription.suburl is defined -%}
              {%- set url = cfg.subscription.suburl -%}
              {%- set url_parts = url.split('/') -%}
              {%- set base_url = url_parts[:-1] | join('/') + '/' -%}
              {%- set _ = suburls.append(base_url) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ suburls | join(' ') }}

    - name: Sync SERVERS in .env from ansible configs
      # Единственный автоматически управляемый ключ .env: список апстримов
      # собирается из configs/3x-ui_*.yml. Остальные ключи (SUB, SITE_*, TLS_MODE,
      # PATH_SSL_KEY) задаются вручную при первичной установке — как в README.
      # restart не перечитывает env_file: пересоздаёт контейнер только up -d.
      ansible.builtin.lineinfile:
        path: "{{ path }}/.env"
        regexp: '^SERVERS='
        line: 'SERVERS="{{ subnginx3xui_vpn_servers_sub }}"'
        mode: "0644"
      notify: docker up 3xuiproxy

    - name: Remove stale nested copy from pre-submodule layout
      ansible.builtin.file:
        path: "{{ path }}/3x-ui-sub"
        state: absent

    - name: Remove build-context files and rollback overrides from earlier eras
      # docker-compose.override.yml уходит ДО вызова up-хендлера, иначе
      # откат (rollback-образ) переживает деплой
      ansible.builtin.file:
        path: "{{ path }}/{{ item }}"
        state: absent
      loop:
        - Dockerfile
        - config_fetcher.lua
        - nginx.conf.esh
        - README.md
        - README_RU.md
        - LICENSE
        - generate-env.sh
        - .env.template
        - tests
        - docker-compose.override.yml

    - name: Import file copy tasks
      ansible.builtin.import_tasks: filescopy.yml

    - name: Force handlers to run after file copy
      ansible.builtin.meta: flush_handlers

    - name: Converge proxy stack (pull latest image, recreate if needed)
      # Безусловный up: pull_policy=always тянет свежий :latest и пересоздаёт
      # контейнер, даже когда ни один файл роли не менялся (релиз только образа)
      ansible.builtin.command:
        cmd: "{{ common_compose_command | default('docker compose') }} up -d"
        chdir: "{{ path }}"
      register: subnginx3xui_compose_converge
      changed_when: >-
        subnginx3xui_compose_converge.stdout is search('Creating')
        or subnginx3xui_compose_converge.stdout is search('Recreating')
        or subnginx3xui_compose_converge.stdout is search('Starting')

    - name: Read .env file
      ansible.builtin.slurp:
        src: "{{ subnginx3xui_nginx_proxy_sub }}/.env"
      register: subnginx3xui_env_file

    - name: Parse .env file
      ansible.builtin.set_fact:
        subnginx3xui_env_vars: >-
          {{ subnginx3xui_env_file.content | b64decode
          | regex_replace('^#.*$', '')
          | regex_replace('\n+', '\n')
          | regex_replace('^\n', '')
          | regex_replace('\n$', '')
          | regex_replace('=', ': ')
          | from_yaml
          }}

    - name: Get inbound_sub_id from vpn_servers role
      ansible.builtin.set_fact:
        subnginx3xui_inbound_sub_id: "{{ vpnserver_inbound_sub_id }}"
        subnginx3xui_inbound_sub_id_ru: "{{ vpnserver_inbound_sub_id_ru }}"

    - name: Create all subs config file
      ansible.builtin.template:
        src: all_subs.yml.j2
        dest: "{{ subnginx3xui_configs_dir }}/all_3x-ui_sub.yml"
        mode: "0644"
      vars:
        all_configs: "{{ subnginx3xui_config_contents }}"
      delegate_to: moro
