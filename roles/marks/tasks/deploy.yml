---
- name: Deploy marks with health-check
  block:
    - name: Pull latest image
      ansible.builtin.command:
        cmd: "docker pull {{ marks_image }}"
      register: marks_pull_result
      changed_when: "'Downloaded newer image' in marks_pull_result.stdout or 'Pull complete' in marks_pull_result.stdout"
      notify: docker up marks
      tags: [deploy]

    - name: Bring stack up
      ansible.builtin.command: "{{ common_compose_command | default('docker compose') }} up -d"
      args:
        chdir: "{{ path }}"
      register: marks_up_result
      changed_when: >-
        marks_up_result.stdout is search('Creating')
        or marks_up_result.stdout is search('Recreating')
        or marks_up_result.stdout is search('Starting')
        or marks_up_result.stderr is search('Creating')
        or marks_up_result.stderr is search('Started')
      tags: [deploy]

    - name: Wait for container to be ready
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ marks_backend_port }}"
        delay: 5
        timeout: 60
      tags: [deploy]

    - name: Health check
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ marks_backend_port }}/healthz"
        method: GET
        status_code: [200]
      register: marks_health_check
      retries: 5
      delay: 5
      until: marks_health_check.status == 200
      tags: [deploy]
