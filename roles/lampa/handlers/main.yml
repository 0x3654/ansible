---
# handlers file for lampa

- name: Docker down lampa
  ansible.builtin.command: "{{ common_compose_command | default('docker compose') }} down"
  args:
    chdir: "{{ path }}"
  register: lampa_compose_down_result
  changed_when: >-
    lampa_compose_down_result.stdout is search('Removing')
    or lampa_compose_down_result.stdout is search('Stopped')
  failed_when: false
  listen: docker down lampa

- name: Docker up lampa
  ansible.builtin.command: "{{ common_compose_command | default('docker compose') }} up -d"
  args:
    chdir: "{{ path }}"
  register: lampa_compose_up_result
  changed_when: >-
    lampa_compose_up_result.stdout is search('Creating')
    or lampa_compose_up_result.stdout is search('Recreating')
    or lampa_compose_up_result.stdout is search('Starting')
  listen: docker up lampa

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  listen: reload nginx
