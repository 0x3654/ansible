---
# cobalt читает cookies.json только при старте: когда keeper обновил файл
# (куки через TG-бота) — рестартуем контейнер. Проверка раз в 2 минуты.
- name: Install cookies-restart cron
  ansible.builtin.cron:
    name: "vdl-cobalt-cookies-restart"
    minute: "*/2"
    job: >
      [ {{ vdl_cookies_dir }}/cookies.json -nt {{ vdl_cookies_dir }}/.stamp ]
      && docker restart {{ vdl_cobalt_container }} >/dev/null 2>&1
      && touch {{ vdl_cookies_dir }}/.stamp
    state: present
  tags: [cron]
