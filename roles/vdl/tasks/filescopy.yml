---
- name: Ensure base and cookies directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ path }}"
    - "{{ vdl_cookies_dir }}"
  tags: [filescopy]

# /data — состояние keeper (accounts.json, query-ids); keeper в контейнере
# работает как 65534, seed-аккаунты кладём до первого старта
- name: Ensure data dir exists for keeper (uid 65534)
  ansible.builtin.file:
    path: "{{ path }}/data"
    state: directory
    mode: "0700"
    owner: "65534"
    group: "65534"
  tags: [filescopy]

# cookies-каталог пишет keeper (65534, tmp+rename); cobalt и cron — root
- name: Ensure cookies dir writable by keeper
  ansible.builtin.file:
    path: "{{ vdl_cookies_dir }}"
    state: directory
    mode: "0700"
    owner: "65534"
    group: "65534"
  tags: [filescopy]

- name: Seed empty cookies.json if absent
  ansible.builtin.copy:
    content: "{}"
    dest: "{{ vdl_cookies_dir }}/cookies.json"
    mode: "0600"
    force: false
  tags: [filescopy]

- name: Resolve docker group gid (для монтирования сокета в keeper)
  ansible.builtin.getent:
    database: group
    key: docker
  tags: [filescopy]

- name: Copy pot shim script
  ansible.builtin.copy:
    src: vdl/get_pot_shim.py
    dest: "{{ path }}/get_pot_shim.py"
    mode: "0644"
  tags: [filescopy]

- name: Render docker compose from template
  ansible.builtin.template:
    src: vdl-compose.yaml.j2
    dest: "{{ path }}/docker-compose.yaml"
    mode: "0640"
  tags: [filescopy]
