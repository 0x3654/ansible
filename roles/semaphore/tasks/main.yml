---
- name: Import APT management tasks
  ansible.builtin.import_tasks: apt.yml
  tags: [apt, upgrade]
  when: semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]

- name: Create role directory
  ansible.builtin.file:
    path: "{{ path }}"
    state: directory
    mode: "{{ directory_mode }}"

- name: Ensure system user exists
  ansible.builtin.user:
    name: "{{ folder_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
  when: semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]

- name: Set directory ownership
  ansible.builtin.file:
    path: "{{ path }}"
    state: directory
    owner: "{{ folder_user }}"
    group: "{{ folder_user }}"
    mode: "{{ directory_mode }}"
  when: semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]

- name: Import certbot tasks
  ansible.builtin.import_tasks: certbot.yml
  tags: [certbot]
  when: semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]

- name: Check if database already exists
  ansible.builtin.stat:
    path: "{{ path }}/data/database.sqlite"
  register: semaphore_db_stat
  tags: [filescopy]

- name: Create data directory
  ansible.builtin.file:
    path: "{{ path }}/data"
    state: directory
    owner: "{{ semaphore_container_uid }}"
    group: "{{ semaphore_container_uid }}"
    mode: "{{ directory_mode }}"
  when:
    - not semaphore_db_stat.stat.exists
    - semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]
  tags: [filescopy]

- name: Seed database if not present
  ansible.builtin.copy:
    src: "{{ role_path }}/files/database.sqlite"
    dest: "{{ path }}/data/database.sqlite"
    owner: "{{ semaphore_container_uid }}"
    group: "{{ semaphore_container_uid }}"
    mode: "0644"
  when:
    - not semaphore_db_stat.stat.exists
    - semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]
  tags: [filescopy]

- name: Import file copy tasks
  ansible.builtin.import_tasks: filescopy.yml
  tags: [filescopy]

- name: Import nginx tasks
  ansible.builtin.import_tasks: nginx.yml
  tags: [nginx]
  when: semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]

- name: Import firewall tasks
  ansible.builtin.import_tasks: firewall.yml
  tags: [firewall]
  when: semaphore_variant == 'prod'  # noqa: var-naming[no-role-prefix]

# --- Бэкап: раннер (если ещё не стоит) и контракт этой роли (последний шаг) ---
- name: Обеспечить локальный бэкап-раннер
  ansible.builtin.include_role:
    name: common
    tasks_from: backup.yml

- name: Записать бэкап-контракт semaphore
  ansible.builtin.include_role:
    name: common
    tasks_from: backup-contract.yml
  vars:
    backup_contract:
      role: semaphore
      items:
        - name: semaphore-data
          kind: bind
          path: "{{ path }}/data"
          retention: 7

- name: Записать экстра-контракты хоста (catch-all и пр., из host_vars)
  ansible.builtin.include_role:
    name: common
    tasks_from: backup-contract.yml
  vars:
    backup_contract: "{{ item.value }}"
  loop: "{{ backup_extra_contracts | default({}) | dict2items }}"
