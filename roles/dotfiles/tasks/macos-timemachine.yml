---
# Time Machine — только ночные копии (02:30, launchd-демон от root).
# Автобэкапы macOS выключаем: дефолтные часовые (или AutoBackupInterval=86400,
# ставившийся вручную до 2026-09-25) грузили сеть днём и рандомно теряли дни.
# Ключ AutoBackupInterval не трогаем — при AutoBackup=0 он мёртв.

- name: Time Machine | Текущее состояние AutoBackup
  ansible.builtin.command:
    cmd: defaults read /Library/Preferences/com.apple.TimeMachine.plist AutoBackup
  register: _tm_autobackup
  changed_when: false
  failed_when: false

- name: Time Machine | Выключить автобэкапы (копии — по ночам джобой)
  ansible.builtin.command:
    cmd: tmutil disable
  when: _tm_autobackup.stdout | trim != '0'
  become: true

- name: Time Machine | Установить LaunchDaemon ночной копии
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/macos/timemachine/com.user.timemachine-nightly.plist"
    dest: /Library/LaunchDaemons/com.user.timemachine-nightly.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: _tm_plist

- name: Time Machine | Выгрузить демона перед заменой plist
  ansible.builtin.command:
    cmd: launchctl bootout system/com.user.timemachine-nightly
  when: _tm_plist.changed
  become: true
  failed_when: false

- name: Time Machine | Проверить, что демон загружен
  ansible.builtin.command:
    cmd: launchctl print system/com.user.timemachine-nightly
  register: _tm_loaded
  changed_when: false
  failed_when: false

- name: Time Machine | Загрузить демона
  ansible.builtin.command:
    cmd: launchctl bootstrap system /Library/LaunchDaemons/com.user.timemachine-nightly.plist
  when: _tm_loaded.rc != 0
  become: true

# ── Docker.raw: не бэкапим VM-диск файлом, данные томов вынимаем архивами ──────
# Docker Desktop на macOS = один sparse-файл 1.8T логических, грязнится от любого
# чиха контейнеров; TM в сетевой бандл sparse не умеет → ночные копии ползли
# часами. Вместо него: pg1c уже дампится в ~/code/_bd_backup, остальные
# именованные тома экспортируются launchd-агентом 00:30 (до слота TM 01:00).

- name: Time Machine | Docker.raw | проверка наличия
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw"
  register: _docker_raw

- name: Time Machine | Docker.raw | текущий статус исключения
  ansible.builtin.command:
    cmd: tmutil isexcluded {{ ansible_env.HOME }}/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw
  register: _tm_raw_excl
  changed_when: false
  failed_when: false
  when: _docker_raw.stat.exists

- name: Time Machine | Docker.raw | исключить из TM
  ansible.builtin.command:
    cmd: tmutil addexclusion -p {{ ansible_env.HOME }}/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw
  when:
    - _docker_raw.stat.exists
    - "'[Excluded]' not in _tm_raw_excl.stdout"
  become: true

- name: Time Machine | Docker volumes | каталог ~/.local/bin
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"
  when: _docker_raw.stat.exists

- name: Time Machine | Docker volumes | скрипт экспорта томов
  ansible.builtin.copy:
    src: "{{ role_path }}/files/dotfiles/macos/timemachine/backup-docker-volumes.sh"
    dest: "{{ ansible_env.HOME }}/.local/bin/backup-docker-volumes.sh"
    mode: "0755"
  when: _docker_raw.stat.exists

- name: Time Machine | Docker volumes | LaunchAgent 00:30
  ansible.builtin.template:
    src: com.user.backup-docker-volumes.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.user.backup-docker-volumes.plist"
    mode: "0644"
  when: _docker_raw.stat.exists
  register: _dvl_plist

- name: Time Machine | Docker volumes | перезагрузить агента
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/com.user.backup-docker-volumes 2>/dev/null || true
    launchctl bootstrap gui/$(id -u) {{ ansible_env.HOME }}/Library/LaunchAgents/com.user.backup-docker-volumes.plist
  when:
    - _docker_raw.stat.exists
    - _dvl_plist.changed
  changed_when: true

# citrus и прочие мак-без-докера: вычистить агент, если стоял до guard'а
- name: Time Machine | Docker volumes | выгрузить агента там, где докера нет
  ansible.builtin.shell: |
    launchctl bootout gui/$(id -u)/com.user.backup-docker-volumes 2>/dev/null || true
    rm -f {{ ansible_env.HOME }}/Library/LaunchAgents/com.user.backup-docker-volumes.plist \
          {{ ansible_env.HOME }}/.local/bin/backup-docker-volumes.sh
    exit 0
  when: not _docker_raw.stat.exists
  changed_when: true
